[advisories]
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, not a vulnerability" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: unmaintained, read by askama's derive while uniffi-bindgen-swift is built, not a vulnerability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/lorenzolfm/wt", "https://github.com/uzaaft/libghostty-rs"]

[bans]
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

exceptions = [
  { crate = "uniffi", allow = ["MPL-2.0"] },
  { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
  { crate = "uniffi_core", allow = ["MPL-2.0"] },
  { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_meta", allow = ["MPL-2.0"] },
  { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
  { crate = "uniffi_udl", allow = ["MPL-2.0"] },
]
