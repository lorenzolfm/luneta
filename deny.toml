# What cargo-deny gates on, as `dev deny` runs it. `advisories` needs the day's
# database, so CI runs it as a step. The other three need no network, so they
# are a flake check.

[advisories]
# Advisory IDs luneta is not affected by, each with why it is none.
ignore = [
  # paste is no longer maintained, which is not a vulnerability: it is a
  # proc-macro macro, unchanged and correct, that xn-gemm and tokenizers
  # still build with. No replacement needs to land before a real flaw does.
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, not a vulnerability" },
  # This flaw is in pulldown-cmark's wikilink parsing, reachable only with
  # `Options::ENABLE_WIKILINKS` set. luneta has pulldown-cmark through
  # prost-build's doc generation, which sets no wikilinks and runs at build
  # time on luneta's own proto comments: the parser never sees input that
  # the advisory's quadratic path requires.
  { id = "RUSTSEC-2026-0433", reason = "pulldown-cmark wikilink flaw needs ENABLE_WIKILINKS, set only by prost-build on trusted input at build time" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/lorenzolfm/wt", "https://github.com/uzaaft/libghostty-rs"]

[bans]
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
