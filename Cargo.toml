# The plugin is the root package, and the daemon and the protocol both read
# are members beside it. A plain `cargo build` here builds the plugin alone:
# the root package is the workspace's default member.
[workspace]
members = ["crates/*"]

# One version for the plugin and the daemon, which ship together and speak the
# same protocol.
[workspace.package]
version = "0.2.2"

[package]
name = "luneta"
version.workspace = true
edition = "2021"

# Not `luneta`, which is the name of the CLI that `crates/lunetad` builds: the
# two would land on the same path in a host build of the whole workspace. The
# file installed into zellij is still `luneta.wasm`; `dev install` and the
# release name it themselves.
[[bin]]
name = "luneta-plugin"
path = "src/main.rs"

[dependencies]
zellij-tile = "=0.45.0"
# Same crates the upstream session-manager uses, at the versions zellij's own
# workspace pins. `fuzzy-matcher` is the skim scorer behind the filter.
fuzzy-matcher = { version = "0.3.7", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }
# Claude Code's transcripts and its list of plugins are JSON. Both crates are
# already in the tree by way of `zellij-tile`, so naming them here costs a
# manifest line and no wasm bytes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The menu's entries come as KDL, the way zellij hands over a node of a
# plugin's configuration that has children. zellij parses its config with this
# crate, at this version.
kdl = { version = "4.7.1", default-features = false }
# What the daemon says of the host comes as the protocol encodes it. prost is
# for decoding it: zellij-tile's own is of another version.
luneta-protocol = { path = "crates/protocol" }
prost = "0.14.4"

[profile.release]
opt-level = "z"
lto = true
strip = true

# `all` and `pedantic` at the bottom, then the `restriction` lints that are worth
# warning on top of them, then the pedantic lints that cost more than they catch.
# Priority orders the overlap: a later priority wins, so the explicit entries
# below survive the blanket `warn`s above.
#
# `dev clippy` is what runs this set; it denies warnings, so every `warn` here is
# an error on a branch. Every package in the workspace takes it, with
# `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "warn", priority = 0 }
pedantic = { level = "warn", priority = 1 }

# Behaviors `restrict`ed by law
allow_attributes = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
implicit_clone = { level = "warn", priority = 2 }
redundant_test_prefix = { level = "warn", priority = 2 }
redundant_type_annotations = { level = "warn", priority = 2 }
str_to_string = { level = "warn", priority = 2 }
todo = { level = "warn", priority = 2 }
try_err = { level = "warn", priority = 2 }
unimplemented = { level = "warn", priority = 2 }
unwrap_used = { level = "warn", priority = 2 }
panic = { level = "warn", priority = 2 }

# `Pedantic` lints that are too pedantic
cast-possible-wrap = { level = "allow", priority = 3 }
cast-precision-loss = { level = "allow", priority = 3 }
cast_possible_truncation = { level = "allow", priority = 3 }
cast_sign_loss = { level = "allow", priority = 3 }
inconsistent_digit_grouping = { level = "allow", priority = 3 }
missing-errors-doc = { level = "allow", priority = 3 }
missing_panics_doc = { level = "allow", priority = 3 }
result_large_err = { level = "allow", priority = 3 }
too_many_arguments = {  level = "allow", priority = 3 }
too_many_lines = { level = "allow", priority = 3 }
unreadable_literal = { level = "allow", priority = 3 }
disallowed_methods = { level = "allow", priority = 3 }

[workspace.lints.rust]
unsafe_code = "deny"

[lints]
workspace = true
