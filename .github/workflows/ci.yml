# Lint and test on every PR, and on main once a PR lands, and check what
# Cargo.lock locks against RustSec's advisories, anew each time: one landed
# after the last run fails the run that locks nothing new, which is what the
# check is for.
#
# CI builds through the flake and not through a toolchain action, so that the build
# is written down once: the rust it builds with and how cargo is run are the
# flake's, as they are in the devshell.
#
# Actions are pinned by commit SHA, not by tag. `@v7` is a ref that the repo of the
# action can move at any time, so a tag pin trusts every future commit of that repo.
# Whatever runs here runs with this repo's token. The comment after each SHA is a
# label for a person; the SHA is the pin.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clippy:
    # One runner, x86_64 Linux, so what is behind `cfg(target_os = "macos")`
    # goes unlinted.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # keep-outputs, for the cache below.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = true

      # The nix store, as the last run on main left it, so that a run builds only
      # what main has not built (#187). Each crate's dependencies are a derivation
      # of their own (crane, in flake.nix), so a PR that changes luneta's code
      # compiles luneta's crates and none of the others, and one that changes
      # nothing cargo reads compiles nothing.
      #
      # Only main saves, and a PR restores what main saved. The Actions cache holds
      # 10 GB for the whole repo, and a PR's store would serve that PR alone while
      # it pushed main's out. The key is a hash of what nix reads: the flake, and
      # the files its sources filter to. main saves once for each change to them,
      # and GitHub evicts the stores no run restores any more. The key decides when
      # main saves, never what nix builds: a file it misses costs a rebuild, not a
      # wrong build.
      #
      # Before main saves, the store is collected down to what this job built and
      # what built it, which keep-outputs keeps alive behind the `result` links.
      # Without it each store would carry every build before it.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'nix/**', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**', 'proto/**', 'skills/luneta/SKILL.md', 'clippy.toml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size: 0

      # Nothing else reaches `dev`: `packages` is a lazy attrset, so a `dev` that does
      # not build evaluates fine and CI goes green. `nix flake check` is no backstop
      # either — it evaluates the derivation without building it. Build it, so that
      # writeShellApplication runs shellcheck over the recipes. A broken `dev` breaks
      # `nix develop`, which is the way the README tells a contributor to build.
      - name: Build the dev CLI
        run: nix build --no-link .#dev

      # `dev clippy`'s run, as the flake's check makes it in the sandbox, against the
      # dependencies the daemon's build compiles, so that clippy compiles none of
      # them again. Through the flake and not a bare `cargo clippy`: the invocation
      # is written down once (`clippyRun` in flake.nix), and the rust this lints with
      # is the one the flake pins rather than whatever the runner image ships. The
      # lint set itself lives in Cargo.toml and clippy.toml.
      #
      # x86_64-linux by name, the system this job runs on. `--out-link`, so that the
      # store keeps the daemon's dependencies for the cache to save.
      - name: Clippy
        run: nix build -L --out-link clippy .#checks.x86_64-linux.clippy

      # What advisories say of the crates Cargo.lock locks: the ones known of
      # them, which the ones no run has seen yet are the reason for. The
      # database of them is fetched on each run, so a new one fails the run
      # that locks the crate it names, and the ones `deny.toml` says luneta is
      # not affected by, with why, do not.
      #
      # No flake check of it: a derivation has no network, so it would check
      # against the advisories of when it built, as old as the cache's hit of
      # it. A step, and not of the daemon's job: the lock is one for every
      # system the daemon builds on.
      - name: Advisories
        run: nix run .#dev -- deny

  # The daemon on each system it runs on: x86_64 and arm64 Linux, and an Apple
  # Silicon Mac. Through the flake, as the rest of CI goes, and each runner
  # tests the process backend of its own system: `/proc` on Linux, sysinfo on
  # macOS. On Linux the derivation runs the tests in its sandbox. On macOS the
  # sandbox will not run `/bin/ps`, which the tests read a process's start
  # from as Claude Code does, so they run through the devshell instead.
  #
  # Native runners, and no cross build: nix does not build for darwin from
  # Linux, and the arm64 Linux runner is free on a public repository.
  daemon:
    strategy:
      # A failure on one system says nothing of the others; let each finish.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = true

      # The nix store, as in `clippy`. The job and the system are in the key, as each
      # runner builds the daemon for a system of its own.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'nix/**', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**', 'proto/**', 'skills/luneta/SKILL.md', 'clippy.toml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size: 0

      # The Mac's tests build outside the sandbox, so the nix store holds nothing
      # of theirs: their `target/` is cached on its own, with the crates cargo
      # downloads for it. It holds the dependencies, and luneta's crates compile on
      # each run. As in `clippy`, main saves and a PR restores.
      #
      # Its key is what cargo builds the dependencies from: the lockfiles, which
      # name them, the manifests, which turn on their features, flake.nix and
      # rust-toolchain.toml, which name the rust, and .cargo/config.toml, which says
      # how it runs. main saves only on a miss, so a change the key left out would hit
      # the `target/` from before it and never save another, and every run after would
      # compile what changed again. A feature of rustix's, turned on in a manifest,
      # leaves Cargo.lock as it was.
      #
      # A key that misses restores nothing. A PR that changes one of them compiles
      # everything, and so does the run on main that saves its `target/`: had it
      # restored the last one, each `target/` would carry every dependency before it.
      - name: Restore the tests' target/
        id: target
        if: runner.os == 'macOS'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'flake.nix', 'rust-toolchain.toml', '.cargo/config.toml') }}

      # `--locked`, so that the tests build against what Cargo.lock names, as
      # the derivation does. Not incremental, which is for one tree's edits in a row:
      # here it would only add to what the cache saves.
      #
      # `--profile`, so that the devshell is a root of the nix store and main saves
      # it with the rest. The store kept only what the daemon's build needs, and
      # the Mac fetched the rest of the devshell on each run: git, its perl, and
      # shellcheck. With the build below skipped, it would fetch the rust too.
      - name: Test the daemon outside the sandbox
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 0
        run: nix develop --profile devshell -c cargo test --locked -p lunetad -p luneta-protocol

      # The daemon with the features its build turns on, which are not the tests':
      # `cargo test` turns on what the dev-dependencies ask of a crate for the daemon
      # too, rustix's `pty` among them. What is behind `cfg(target_os = "macos")`
      # compiles on the Mac alone, so a call there that needs such a feature would
      # pass the tests and fail the build below, which the Mac skips where the
      # `target/` hit.
      #
      # A check, which writes no code. On each run and not only where the build is
      # skipped, so that main saves what it checked of the dependencies with the
      # `target/`, and a PR checks luneta's crates alone.
      - name: Check the daemon without the tests' features
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 0
        run: nix develop -c cargo check --locked -p lunetad

      # On the Mac, only where the tests' `target/` missed: where the lockfiles, the
      # manifests, flake.nix, rust-toolchain.toml or .cargo/config.toml changed. The
      # check above has compiled luneta's code on the Mac with the features this build
      # turns on, and the Linux runners build this derivation from the same source, so
      # what a build here adds is what is the Mac's own in it: what nixpkgs gives it to
      # build with on darwin, which only those files change. Built on each run, it
      # compiled luneta's crates a second time, in release, for nothing the tests and
      # the check had not said.
      #
      # A run on main that skips it saves a store without the daemon's
      # dependencies, so the next run to build it builds them too. Most such runs
      # change them, and would build them anyway.
      - name: Build the daemon, and on Linux test it
        if: runner.os != 'macOS' || steps.target.outputs.cache-hit != 'true'
        run: nix build -L .#lunetad

      # After the build, so that main saves a `target/` only where the Mac built the
      # daemon too. A run that hits it skips that build, so a `target/` saved by a run
      # whose build failed would turn every run after it green.
      - name: Save the tests' target/
        if: >-
          runner.os == 'macOS' && github.ref == 'refs/heads/main'
          && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ steps.target.outputs.cache-primary-key }}
