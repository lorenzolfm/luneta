name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  warm:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = true

      - name: Restore main's macOS store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-probe-625-never
          restore-prefixes-first-match: nix-daemon-macOS-ARM64-
          save: false

      - name: Store size
        run: |
          df -h /nix /tmp
          sudo du -sk /nix/store
          sudo find /nix/store | wc -l

      - name: Inventory
        run: python3 probe/inventory.py

  cold:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = true

      - name: Fetch the flake inputs from GitHub
        run: time nix flake archive --json

      - name: Dry run of the devshell
        run: nix build --dry-run .#devShells.aarch64-darwin.default.inputDerivation

      - name: Develop from cache.nixos.org alone
        run: time nix develop --profile "$RUNNER_TEMP/devshell" -c true

      - name: Store size
        run: |
          sudo du -sk /nix/store
          sudo find /nix/store | wc -l
