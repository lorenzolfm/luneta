name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Whether anything but Markdown the build doesn't read changed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            git fetch --depth=1 origin "$BEFORE"
            base="$BEFORE"
          fi
          files="$(git diff --no-renames --name-only "$base" HEAD)"
          docs="$(grep -xE '.*\.md' <<<"$files" | grep -vxF skills/luneta/SKILL.md || true)"
          changed=true
          if [[ -n $files && $docs == "$files" ]]; then
            changed=false
          fi
          echo "$files"
          echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"

  clippy:
    needs: code
    if: ${{ !cancelled() && needs.code.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = true

      - name: nix-community/cache-nix-action v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'nix/**', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**', 'proto/**', 'skills/luneta/SKILL.md', 'clippy.toml', '.config/nextest.toml', 'deny.toml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size: 0
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Root the flake's inputs so the saved store keeps them
        shell: bash
        run: >-
          nix flake archive --json
          | jq -er '.inputs | .. | objects | .path | strings'
          | xargs -r nix build --out-link "$RUNNER_TEMP/inputs"

      - name: Build the dev CLI
        run: nix build --no-link .#dev

      - name: Lints
        run: >-
          nix build -L --keep-going --out-link lint
          .#checks.x86_64-linux.statix
          .#checks.x86_64-linux.deadnix
          .#checks.x86_64-linux.comments

      - name: Bans, licenses and sources
        run: nix build -L --out-link deny .#checks.x86_64-linux.deny

      - name: Clippy
        run: nix build -L --out-link clippy .#checks.x86_64-linux.clippy

      - name: Clippy for the Mac
        if: ${{ !cancelled() }}
        run: nix run .#dev.commands.clippy-cross

      - name: Advisories
        run: nix run .#dev -- deny advisories

  breaking:
    needs: code
    if: >-
      ${{ !cancelled() && needs.code.outputs.changed != 'false'
      && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Breaking changes to the protocol
        run: |
          git update-ref refs/remotes/origin/main HEAD^
          nix run .#dev.commands.lint -- --breaking

  daemon:
    needs: code
    if: ${{ !cancelled() && needs.code.outputs.changed != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = true

      - name: nix-community/cache-nix-action v7
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'nix/**', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**', 'proto/**', 'skills/luneta/SKILL.md', 'clippy.toml', '.config/nextest.toml', 'deny.toml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size: 0
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Root the flake's inputs so the saved store keeps them
        shell: bash
        run: >-
          nix flake archive --json
          | jq -er '.inputs | .. | objects | .path | strings'
          | xargs -r nix build --out-link "$RUNNER_TEMP/inputs"

      - name: Restore the tests' target/, with actions/cache v6.1.0
        id: target
        if: runner.os == 'macOS'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'flake.nix', 'rust-toolchain.toml', '.cargo/config.toml') }}

      - name: Test the daemon outside the sandbox
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 0
          NEXTEST_DOUBLE_SPAWN: 0
        run: |
          nix develop --profile devshell -c sh -ec '
            cargo nextest run --locked --profile ci $LUNETA_TEST_RUN
            cargo test --doc --locked $LUNETA_TEST_RUN
          '

      - name: Check the daemon without the tests' features
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 0
        run: nix develop -c cargo check --locked -p lunetad

      - name: Build the daemon, and on Linux test it
        if: runner.os != 'macOS' || steps.target.outputs.cache-hit != 'true'
        run: nix build -L .#lunetad

      - name: Save the tests' target/, with actions/cache v6.1.0
        if: >-
          runner.os == 'macOS' && github.ref == 'refs/heads/main'
          && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.target.outputs.cache-primary-key }}
