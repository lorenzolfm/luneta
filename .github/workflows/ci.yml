name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Whether anything but Markdown the build doesn't read changed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            git fetch --depth=1 origin "$BEFORE"
            base="$BEFORE"
          fi
          files="$(git diff --no-renames --name-only "$base" HEAD)"
          docs="$(grep -xE '.*\.md' <<<"$files" | grep -vxF skills/luneta/SKILL.md || true)"
          changed=true
          if [[ -n $files && $docs == "$files" ]]; then
            changed=false
          fi
          echo "$files"
          echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"

  clippy:
    needs: code
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - &install-nix
        name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            connect-timeout = 5
            fallback = true
            ${{ runner.os == 'Linux' && !github.event.pull_request.head.repo.fork && 'extra-substituters = https://attic.tail174781.ts.net/main' || '' }}
            ${{ runner.os == 'Linux' && !github.event.pull_request.head.repo.fork && 'extra-trusted-public-keys = main:4Zt9CH+9bGa5vSsFCdxOmqGjhItSREekmxJaB9wmgYY=' || '' }}

      - &tailscale
        name: tailscale/github-action v4.4.0, to reach the attic cache
        id: tailscale
        if: runner.os == 'Linux' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: T7sitKkkpw11CNTRL-k51C6FNh5P11CNTRL
          audience: api.tailscale.com/T7sitKkkpw11CNTRL-k51C6FNh5P11CNTRL
          tags: tag:ci
          ping: attic.tail174781.ts.net

      - name: Build the dev CLI
        run: nix build --no-link .#dev

      - name: Lints
        run: >-
          nix build -L --keep-going --out-link lint
          .#checks.x86_64-linux.statix
          .#checks.x86_64-linux.deadnix
          .#checks.x86_64-linux.comments

      - name: Bans, licenses and sources
        run: nix build -L --out-link deny .#checks.x86_64-linux.deny

      - name: Clippy
        run: nix build -L --out-link clippy .#checks.x86_64-linux.clippy

      - name: Clippy for the Mac
        if: ${{ !cancelled() }}
        run: nix run .#dev.commands.clippy-cross

      - name: Advisories
        run: nix run .#dev -- deny advisories

      - &attic-push
        name: Push the store to the attic cache
        if: ${{ !cancelled() && steps.tailscale.outcome == 'success' }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [[ -z $ATTIC_TOKEN ]]; then
            echo "No ATTIC_TOKEN secret, so nothing is pushed."
            exit 0
          fi
          attic="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#attic-client)/bin/attic"
          "$attic" login homelab https://attic.tail174781.ts.net "$ATTIC_TOKEN"
          nix path-info --all | grep -v '\.drv$' | "$attic" push homelab:main --stdin

  breaking:
    needs: code
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - *install-nix

      - *tailscale

      - name: Breaking changes to the protocol
        run: |
          git update-ref refs/remotes/origin/main HEAD^
          nix run .#dev.commands.lint -- --breaking

  daemon:
    needs: code
    if: ${{ !cancelled() && needs.code.outputs.changed != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
      id-token: write

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - *install-nix

      - *tailscale

      - name: nix-community/cache-nix-action v7
        if: runner.os == 'macOS'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'nix/**', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**', 'proto/**', 'skills/luneta/SKILL.md', 'clippy.toml', '.config/nextest.toml', 'deny.toml', '.github/workflows/ci.yml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size: 0
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Root the flake's inputs so the saved store keeps them
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          nix flake archive --json
          | jq -er '.inputs | .. | objects | .path | strings'
          | xargs -r nix build --out-link "$RUNNER_TEMP/inputs"

      - name: Restore the tests' target/, with actions/cache v6.1.0
        id: target
        if: runner.os == 'macOS'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: &target-paths |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'flake.nix', 'rust-toolchain.toml', '.cargo/config.toml') }}

      - name: Probe, Nix's settings
        run: |
          nix config show | grep -E '^(sandbox|sandbox-fallback|sandbox-paths|extra-sandbox-paths|cores|max-jobs|build-users-group) '
          sysctl -n hw.ncpu
          cat /etc/nix/nix.conf

      - name: Probe, test the daemon inside nix build
        continue-on-error: true
        run: |
          start=$(date +%s)
          nix build -L --keep-going --no-link .#checks.aarch64-darwin.lunetad
          echo "nix build took $(( $(date +%s) - start ))s"

      - name: Test the daemon outside the sandbox
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 0
          NEXTEST_DOUBLE_SPAWN: 0
        run: |
          nix develop --profile devshell -c sh -ec '
            luneta-nextest --profile ci
            cargo test --doc --locked $LUNETA_TEST_RUN
          '

      - name: Check the daemon without the tests' features
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: 0
        run: nix develop -c cargo check --locked -p lunetad

      - name: Build the daemon, and on Linux test it
        if: false
        run: nix build -L ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).lunetad"

      - name: Save the tests' target/, with actions/cache v6.1.0
        if: >-
          runner.os == 'macOS' && github.ref == 'refs/heads/main'
          && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *target-paths
          key: ${{ steps.target.outputs.cache-primary-key }}

      - *attic-push
