# Build on every PR; release when a tag says to.
#
# One workflow rather than two, for the same reason CI builds through the flake
# rather than a toolchain action: the build should be written down once. A
# separate release pipeline would drift from the one PRs exercise, and the drift
# would surface as a tag that fails after the code is already merged.
#
# So the `release` job does not build. It takes the artifact `build` produced,
# which makes the bytes attached to a release the same bytes a PR check went
# green on -- and the same bytes the provenance attestation is cut over.
#
# 🔴 Actions are pinned by COMMIT SHA, not by tag. `@v7` is a branch-like ref the
# action's own repo can repoint at will, so a tag pin trusts every future commit
# that repo ever makes. The threat model for a plugin released this way is
# mostly this pipeline itself: whatever runs here can put bytes in front of
# users under our name. The trailing comment names the human-readable version;
# it is a label, and the SHA is the pin.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Read-only by default. Only `release` widens this, and only for what it must.
permissions:
  contents: read

jobs:
  build:
    # The flake hardcodes `system = "x86_64-linux"`, so the runner has to be
    # one. An arm64 or macos runner would fail in the flake, not in the build.
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Through the flake rather than a toolchain action, so CI builds with the
      # exact rust the flake pins (1.95.0, the channel zellij's own
      # rust-toolchain.toml names) and there is only one place that version is
      # written down.
      #
      # There is nothing to `cargo test`: the crate is a plugin with no test
      # modules, and a green test step that asserts nothing is worse than no
      # test step. This checks that it compiles for wasm32-wasip1, which is the
      # thing a host-target build would not have caught.
      - name: Build
        run: nix develop --command make build

      - name: Read the version out of Cargo.toml
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luneta-wasm
          path: target/wasm32-wasip1/release/luneta.wasm
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release, attach the assets
      id-token: write # OIDC identity the attestation is signed against
      attestations: write # record the provenance attestation

    steps:
      # The tag names the asset, and the asset name is what zellij caches
      # against, so a tag that disagrees with Cargo.toml would ship a build
      # labelled as a version it is not. Cheap to check, miserable to notice
      # after the fact -- the release is already public by then.
      - name: Check the tag agrees with Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="${{ needs.build.outputs.version }}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: luneta-wasm

      # 🔴 The version belongs in the FILENAME, not just the tag directory.
      # Zellij's downloader caches remote plugins by the last path segment of
      # the URL and returns early if that file already exists -- no ETag, no
      # timestamp, no re-fetch, ever (zellij-utils downloader.rs:88-92). Ship
      # every release as `luneta.wasm` and each user is pinned forever to
      # whichever build they happened to download first, with no way to hand
      # them a fix.
      - name: Name the asset after the version
        run: cp luneta.wasm "luneta-${{ needs.build.outputs.version }}.wasm"

      # `sha256sum -c SHA256SUMS` format, one file covering every asset -- the
      # convention, rather than a per-file .sha256 nobody has a one-liner for.
      #
      # ⚠️ On its own this proves only that the download was not truncated or
      # corrupted. It is NOT a defence against tampering: anyone who can replace
      # the asset can replace this file beside it. The attestation below is the
      # part that says where the bytes came from.
      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum "luneta-${{ needs.build.outputs.version }}.wasm" > SHA256SUMS
          cat SHA256SUMS

      # Keyless, via the runner's OIDC identity -- there is no private key here
      # to guard, rotate, or leak. The claim is stronger than a signature's: not
      # "somebody holding a key signed these bytes" but "these bytes came out of
      # this workflow, at this commit, in this repo, on a GitHub-hosted runner".
      #
      #   gh attestation verify luneta-<version>.wasm -R lorenzolfm/luneta
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: luneta-${{ needs.build.outputs.version }}.wasm

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            luneta-${{ needs.build.outputs.version }}.wasm
            SHA256SUMS
          generate_release_notes: true
