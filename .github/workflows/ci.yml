name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.diff.outputs.plan }}

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Whether anything but Markdown the build doesn't read changed, and whether breaking, the dev CLI, or ios need to run
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          base=HEAD^
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            git fetch --depth=1 origin "$BEFORE"
            base="$BEFORE"
          elif [[ $GITHUB_EVENT_NAME == merge_group ]]; then
            git fetch --depth=1 origin "$MERGE_BASE"
            base="$MERGE_BASE"
          fi
          files="$(git -c core.quotepath=false diff --no-renames --name-only "$base" HEAD)"
          ios_dirs=(
            ios
            crates/phone
            crates/phone-bindgen
            crates/protocol
            proto
          )
          ios_files=(
            Cargo.toml
            Cargo.lock
            clippy.toml
            rust-toolchain.toml
            flake.nix
            flake.lock
            nix/ios.nix
            nix/dev/default.nix
            nix/dev/commands/ios.nix
            .github/workflows/ci.yml
          )
          dir_args=()
          for dir in "${ios_dirs[@]}"; do
            if [[ ! -d $dir ]]; then
              echo "::error::ios filter directory missing: $dir" >&2
              exit 1
            fi
            if [[ ! $dir =~ ^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$ ]]; then
              echo "::error::ios filter directory is not a canonical relative path: $dir" >&2
              exit 1
            fi
            dir_args+=(-e "^$dir/")
          done
          file_args=()
          for file in "${ios_files[@]}"; do
            if [[ ! -f $file ]]; then
              echo "::error::ios filter file missing: $file" >&2
              exit 1
            fi
            if [[ ! $file =~ ^\.?[A-Za-z0-9_-][A-Za-z0-9_.-]*(/\.?[A-Za-z0-9_-][A-Za-z0-9_.-]*)*$ ]]; then
              echo "::error::ios filter file is not a canonical relative path: $file" >&2
              exit 1
            fi
            file_args+=(-e "$file")
          done
          any_matches() {
            local pattern="${1:-}"
            if [[ -z $pattern ]]; then
              echo "diff: any_matches requires a non-empty pattern" >&2
              exit 2
            fi
            local status=0
            grep --quiet --extended-regexp -- "$pattern" <<<"$non_docs" || status=$?
            case "$status" in
              0) return 0 ;;
              1) return 1 ;;
              *) exit "$status" ;;
            esac
          }
          non_docs=""
          if [[ -n $files ]]; then
            status=0
            non_docs="$(grep -vxE '.*\.md' <<<"$files")" || status=$?
            case "$status" in
              0 | 1) ;;
              *) exit "$status" ;;
            esac
            status=0
            grep -qxF skills/lune/SKILL.md <<<"$files" || status=$?
            case "$status" in
              0) non_docs="${non_docs:+$non_docs$'\n'}skills/lune/SKILL.md" ;;
              1) ;;
              *) exit "$status" ;;
            esac
          fi
          if [[ -n $files && -z $non_docs ]]; then
            plan="$(jq -cn '{kind: "docs"}')"
          else
            breaking=true
            dev=true
            ios=true
            if [[ -n $files ]]; then
              any_matches '^(proto/|nix/dev/(default|commands/lint)\.nix$|flake\.(nix|lock)$|\.github/workflows/ci\.yml$)' || breaking=false
              any_matches '^(nix/.*\.nix$|flake\.(nix|lock)$|\.github/workflows/ci\.yml$)' || dev=false
              ios=false
              status=0
              grep -qxF "${file_args[@]}" <<<"$non_docs" || status=$?
              case "$status" in
                0) ios=true ;;
                1) ;;
                *) exit "$status" ;;
              esac
              if [[ $ios == false ]]; then
                status=0
                grep -qE "${dir_args[@]}" <<<"$non_docs" || status=$?
                case "$status" in
                  0) ios=true ;;
                  1) ;;
                  *) exit "$status" ;;
                esac
              fi
            fi
            plan="$(jq -cn --argjson breaking "$breaking" --argjson dev "$dev" --argjson ios "$ios" '{kind: "code", breaking: $breaking, dev: $dev, ios: $ios}')"
          fi
          echo "$files"
          printf 'plan=%s\n' "$plan" | tee -a "$GITHUB_OUTPUT"

  clippy:
    needs: code
    if: >-
      ${{ !cancelled() && needs.code.result == 'success'
      && fromJSON(needs.code.outputs.plan).kind == 'code' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - &checkout-head
        name: actions/checkout v7, at the head to test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - &install-nix
        name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            connect-timeout = 5
            stalled-download-timeout = 30
            download-attempts = 3
            fallback = true
            ${{ runner.os == 'macOS' && 'keep-outputs = true' || '' }}
            ${{ !github.event.pull_request.head.repo.fork && 'extra-substituters = https://attic.tail174781.ts.net/main' || '' }}
            ${{ !github.event.pull_request.head.repo.fork && 'extra-trusted-public-keys = main:4Zt9CH+9bGa5vSsFCdxOmqGjhItSREekmxJaB9wmgYY=' || '' }}

      - &tailscale
        name: tailscale/github-action v4.4.0, to reach the attic cache
        id: tailscale
        if: ${{ !github.event.pull_request.head.repo.fork }}
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: T7sitKkkpw11CNTRL-k51C6FNh5P11CNTRL
          audience: api.tailscale.com/T7sitKkkpw11CNTRL-k51C6FNh5P11CNTRL
          tags: tag:ci
          ping: attic.tail174781.ts.net

      - name: Build the dev CLI, when what it is built from changed
        id: dev
        if: fromJSON(needs.code.outputs.plan).dev != false
        run: nix build --no-link .#dev

      - name: Formatting
        if: ${{ !cancelled() && (success() || steps.dev.outcome == 'failure') }}
        run: nix run .#dev.commands.fmt -- --check

      - name: Lints, bans, licenses, sources, and clippy for Linux and the Mac
        if: ${{ !cancelled() && (success() || steps.dev.outcome == 'failure') }}
        run: nix build -L --keep-going --out-link checks .#checks.x86_64-linux.lints

      - name: Evaluate release derivations
        if: ${{ !cancelled() && (success() || steps.dev.outcome == 'failure') }}
        run: >-
          nix eval --json .#packages
          --apply 'builtins.mapAttrs (_: packages: packages.luned.drvPath)'
          >/dev/null

      - name: Advisories
        run: nix run .#dev.commands.deny -- advisories

      - &attic-push
        name: Push what this job built to the attic cache
        if: ${{ !cancelled() && steps.tailscale.outcome == 'success' }}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: nix run .#dev.commands.attic-push

  breaking:
    needs: code
    if: >-
      ${{ !cancelled() && needs.code.result == 'success'
      && github.event_name == 'pull_request'
      && fromJSON(needs.code.outputs.plan).kind == 'code'
      && fromJSON(needs.code.outputs.plan).breaking != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - *install-nix

      - *tailscale

      - name: Breaking changes to the protocol
        run: |
          git update-ref refs/remotes/origin/main HEAD^
          nix run .#dev.commands.lint -- --breaking

  tested:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      untested: ${{ steps.tested.outputs.untested }}

    steps:
      - *checkout-head

      - *install-nix

      - *tailscale

      - name: The runners whose tested luned attic doesn't hold
        id: tested
        env:
          TAILSCALE: ${{ steps.tailscale.outcome }}
        run: |
          set -euo pipefail
          if [[ $TAILSCALE != success ]]; then
            untested="$(nix eval --json .#ciRunners | jq -ce 'if type == "object" and length > 0 then to_entries | map(if (.key | type == "string" and length > 0) and (.value | type == "string" and length > 0) then {runner: .value, system: .key} else error("invalid ciRunners entry") end) else error("ciRunners must be a non-empty object") end')"
            echo "untested=$untested" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          targets="$(nix eval --json .#testedTargets)"
          rows="$(jq -er 'to_entries | if length > 0 then .[] | [.key, .value.runner, .value.path] | @tsv else error("testedTargets must be non-empty") end' <<<"$targets")"
          untested='[]'
          while IFS=$'\t' read -r system runner check; do
            if nix store verify --no-contents --store https://attic.tail174781.ts.net/main "$check"; then
              echo "attic holds $system's tested $check"
            else
              untested="$(jq -cn --argjson list "$untested" --arg runner "$runner" --arg system "$system" '$list + [{runner: $runner, system: $system}]')"
            fi
          done <<<"$rows"
          echo "untested=$untested" | tee -a "$GITHUB_OUTPUT"

  daemon:
    needs: [code, tested]
    if: >-
      ${{ !cancelled()
      && needs.code.result == 'success'
      && fromJSON(needs.code.outputs.plan).kind == 'code'
      && (needs.tested.result == 'skipped'
      || (needs.tested.result == 'success' && needs.tested.outputs.untested != '[]')) }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(needs.tested.result == 'skipped'
          && '[{"runner":"ubuntu-latest","system":"x86_64-linux"},{"runner":"ubuntu-24.04-arm","system":"aarch64-linux"},{"runner":"macos-latest","system":"aarch64-darwin"}]'
          || needs.tested.outputs.untested) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
      id-token: write

    steps:
      - *checkout-head

      - *install-nix

      - *tailscale

      - &macos-dns
        name: Give macOS its own DNS back, and only the tailnet's names to MagicDNS
        if: runner.os == 'macOS' && steps.tailscale.outcome != 'skipped'
        env:
          TAILSCALE: ${{ steps.tailscale.outcome }}
        run: |
          sudo networksetup -setdnsservers Ethernet Empty
          sudo networksetup -setsearchdomains Ethernet Empty
          if [[ $TAILSCALE == success ]]; then
            sudo mkdir -p /etc/resolver
            echo 'nameserver 100.100.100.100' | sudo tee /etc/resolver/tail174781.ts.net
          fi
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder
          curl -sSf --max-time 10 -o /dev/null https://cache.nixos.org/nix-cache-info
          attic=https://attic.tail174781.ts.net/main/nix-cache-info
          if [[ $TAILSCALE == success ]] && ! curl -sSf --max-time 10 -o /dev/null "$attic"; then
            echo "::warning::attic did not answer, so this job goes on without it"
          fi

      - name: nix-community/cache-nix-action v7
        if: runner.os == 'macOS'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'nix/**', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'proto/**', 'skills/lune/SKILL.md', 'clippy.toml', '.config/nextest.toml', 'deny.toml', '.github/workflows/ci.yml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size: 0
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Root the flake's inputs so the saved store keeps them
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          nix flake archive --json
          | jq -er '.inputs | .. | objects | .path | strings'
          | xargs -r nix build --out-link "$RUNNER_TEMP/inputs"

      - name: Build and test the daemon
        run: nix build -L ".#checks.${{ matrix.system }}.luned"

      - *attic-push

  release:
    needs: [code, clippy, tested, daemon]
    if: >-
      ${{ !cancelled() && needs.code.result == 'success'
      && fromJSON(needs.code.outputs.plan).kind == 'code'
      && (github.event_name == 'push' || github.event_name == 'merge_group')
      && needs.clippy.result == 'success'
      && (needs.daemon.result == 'success'
      || (needs.daemon.result == 'skipped' && needs.tested.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - *checkout-head

      - *install-nix

      - *tailscale

      - *macos-dns

      - name: Build the release package
        run: nix build -L ".#packages.${{ matrix.system }}.luned"

      - *attic-push

  ios:
    needs: code
    if: >-
      ${{ !cancelled() && needs.code.result == 'success'
      && fromJSON(needs.code.outputs.plan).kind == 'code'
      && fromJSON(needs.code.outputs.plan).ios != false }}
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - *checkout-head

      - name: cachix/install-nix-action v31
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            connect-timeout = 5
            fallback = true

      - name: Select the Xcode the app is built with
        run: |
          version="$(nix eval --raw --file nix/ios.nix --apply 'ios: (ios { pkgs = { }; }).xcodeVersion')"
          xcode="/Applications/Xcode_$version.app"
          if [[ ! -d $xcode ]]; then
            echo "::error::this runner has no $xcode; it has:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - name: actions/cache v6.1.0, cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: actions/cache v6.1.0, cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: cargo-target-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'clippy.toml', 'crates/phone/Cargo.toml', 'crates/phone-bindgen/Cargo.toml', 'crates/protocol/Cargo.toml', 'rust-toolchain.toml', 'flake.nix', 'flake.lock', 'nix/dev/default.nix', 'nix/dev/commands/ios.nix', '.github/workflows/ci.yml') }}

      - name: Build the app for the simulator
        env:
          CARGO_INCREMENTAL: "0"
        run: nix run .#dev.commands.ios-build

      - name: actions/upload-artifact v7, xcodebuild's whole output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xcodebuild-logs
          path: ios/build/logs
          if-no-files-found: ignore
          retention-days: 7
