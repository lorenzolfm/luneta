# Build on every PR, and release on a tag.
#
# One workflow, not two, for the reason CI builds through the flake and not through
# a toolchain action: the build is written down once. A separate release pipeline
# would differ from the one that PRs run, and the difference would appear as a tag
# that fails after the code is merged.
#
# The `release` job therefore does not build. It takes the artifact that `build`
# produced, so the bytes in a release are the bytes a PR check passed, and the bytes
# the provenance attestation covers.
#
# Actions are pinned by commit SHA, not by tag. `@v7` is a ref that the repo of the
# action can move at any time, so a tag pin trusts every future commit of that repo.
# Whatever runs here can put bytes in front of users under our name. The comment
# after each SHA is a label for a person; the SHA is the pin.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Read-only by default. Only `release` widens this, and only for what it must.
permissions:
  contents: read

jobs:
  build:
    # The flake sets `system = "x86_64-linux"`, so the runner must be one. An arm64
    # or macos runner fails in the flake, not in the build.
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Through the flake and not through a toolchain action, so that CI builds with
      # the rust the flake pins (1.95.0, the channel the rust-toolchain.toml of
      # zellij names) and the version is written down in one place.
      #
      # `nix build .#luneta` and not `nix run .#dev -- build`: the asset a tag ships
      # is built from the dependency revisions Cargo.lock names, fetched by hash into
      # a sandbox with no network, so the bytes the attestation covers do not depend
      # on what cargo happened to resolve on the runner. `dev build` stays the
      # development loop; both run the same cargo invocation.
      #
      # This step also checks that the crate compiles for wasm32-wasip1, which a
      # build for the host target does not check. The unit tests are host-target and
      # are not part of it.
      - name: Build
        run: nix build .#luneta

      # The step above never touches `dev`: `packages` is a lazy attrset and nothing
      # in `luneta` reaches it, so a `dev` that does not build evaluates fine and CI
      # goes green. `nix flake check` is no backstop either — it evaluates the
      # derivation without building it. Build it, so that writeShellApplication runs
      # shellcheck over scripts/dev.sh. A broken `dev` breaks `nix develop`, which is
      # the way the README tells a contributor to build.
      #
      # `--no-link`, so that `result` stays the wasm the next step stages.
      - name: Build the dev CLI
        run: nix build --no-link .#dev

      # Out of the read-only store and under a stable name, so the upload and the
      # release job can both name the file without knowing a store path.
      - name: Stage the artifact
        run: install -m0644 result/luneta.wasm luneta.wasm

      # From the derivation, which reads Cargo.toml, so the version the release
      # checks against the tag is the one the built bytes were stamped with.
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(nix eval --raw .#luneta.version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luneta-wasm
          path: luneta.wasm
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release, attach the assets
      id-token: write # OIDC identity the attestation is signed against
      attestations: write # record the provenance attestation

    steps:
      # The tag names the asset, and zellij caches against the asset name. A tag that
      # disagrees with Cargo.toml would thus release a build under the wrong version,
      # and the release is public before anyone finds the error.
      - name: Check the tag agrees with Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="${{ needs.build.outputs.version }}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: luneta-wasm

      # The version must be in the filename, and not in the tag directory alone. The
      # downloader of zellij caches a remote plugin by the last path segment of the
      # URL, and returns immediately if that file exists. It reads no ETag and no
      # timestamp, and never fetches again (zellij-utils downloader.rs:88-92). A
      # release named `luneta.wasm` would hold every user at the first build they
      # downloaded, with no way to give them a correction.
      - name: Name the asset after the version
        run: cp luneta.wasm "luneta-${{ needs.build.outputs.version }}.wasm"

      # The `sha256sum -c SHA256SUMS` format, in one file that covers every asset.
      #
      # This proves only that the download is complete and not corrupted. It is not a
      # defence against a change of the bytes: anyone who can replace the asset can
      # replace this file beside it. The attestation below says where the bytes came
      # from.
      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum "luneta-${{ needs.build.outputs.version }}.wasm" > SHA256SUMS
          cat SHA256SUMS

      # Keyless, through the OIDC identity of the runner. There is no private key to
      # guard, to rotate, or to lose. The claim is stronger than a signature: not that
      # somebody with a key signed these bytes, but that these bytes came out of this
      # workflow, at this commit, in this repo, on a GitHub runner.
      #
      #   gh attestation verify luneta-<version>.wasm -R lorenzolfm/luneta
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: luneta-${{ needs.build.outputs.version }}.wasm

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            luneta-${{ needs.build.outputs.version }}.wasm
            SHA256SUMS
          generate_release_notes: true
