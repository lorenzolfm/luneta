# The rust every build of luneta is of. The flake reads it, and so does rustup,
# so that a machine with rustup and not nix builds with the same toolchain.
#
# A nightly, by date, so that it moves only when this does: change the date, and
# run `nix flake update rust-overlay`, which has to know of it.
[toolchain]
channel = "nightly-2026-11-04"
