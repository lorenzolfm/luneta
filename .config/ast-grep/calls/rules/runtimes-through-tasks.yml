id: runtimes-through-tasks
language: rust
files:
  - crates/lune/src/**
message: >-
  Run lune's asks of luned on luned::tasks::shared(): lune's main builds that
  one runtime, so a failure to build it is told at launch, and the tasks a
  call hands over go on once the call returns, where a runtime of the call's
  own would drop them with it. lune holds the runtime by its Handle alone, so
  it names no Runtime or LocalRuntime, under any path or alias.
rule:
  all:
    - any:
        - kind: identifier
          regex: ^new_(current_thread|multi_thread)
        - kind: identifier
          regex: ^(Runtime|LocalRuntime)$
        - kind: type_identifier
          regex: ^(Runtime|LocalRuntime)$
        - kind: attribute
          regex: ^(\w+::)+(main|test)\b
    - not:
        inside:
          kind: mod_item
          has:
            field: name
            regex: ^tests$
          stopBy: end
