id: cargo-nextest-through-lune-nextest-in-workflows
valid:
  - "steps:\n  - run: lune-nextest --profile ci\n"
  - "steps:\n  - run: nix develop -c cargo check --locked -p luned\n"
  - "steps:\n  - name: cargo nextest run\n    run: nix run .#dev -- test\n"
  - "steps:\n  - run: |\n      nix develop -c cargo nextest list\n      nix run .#dev -- test\n"
  - "steps:\n  - run: >-\n      nix develop -c cargo nextest list\n\n      nix run .#dev -- test\n"
  - "steps:\n  - run: \"nix develop -c cargo nextest list\\nnix run .#dev -- test\"\n"
invalid:
  - "steps:\n  - run: cargo nextest run\n"
  - "steps:\n  - \"run\": $CARGO nextest run>tests.log\n"
  - "steps:\n  - run: \"nix develop -c cargo nextest run --profile ci\"\n"
  - "steps:\n  - run: |\n      cd crates\n      cargo nextest run -p luned\n"
  - "steps:\n  - run: |\n      cargo nextest \\\n        run -p luned\n"
  - "steps:\n  - run: >-\n      nix develop -c\n      cargo nextest\n      run --profile ci\n"
  - "steps:\n  - run: nix develop -c cargo\n      nextest run --profile ci\n"
