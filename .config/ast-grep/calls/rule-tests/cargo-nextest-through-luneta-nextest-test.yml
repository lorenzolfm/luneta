id: cargo-nextest-through-luneta-nextest
valid:
  - "{ a = ''\n  luneta-nextest --profile ci\n''; }"
  - "{ a = ''\n  ${lib.getExe nextest} --cargo-profile \"$CARGO_PROFILE\" --profile ci\n''; }"
  - "{ a = ''\n  cargo nextest list --run-ignored all\n''; }"
  - "{ a = ''\n  cargo mutants --dir \"$root\" --workspace \"$@\"\n''; }"
  - "{ a = ''\n  cargo build; nextest-report run\n''; }"
  - "{ a = ''\n  cargo nextest list\n  nix run .#dev -- test\n''; }"
  - "{ help = \"the tests on nextest, then the doctests\"; tools = [ pkgs.cargo-nextest ]; }"
  - "{ a = \"cargo nextest list\\nnix run .#dev -- test\"; }"
invalid:
  - "{ a = ''\n  cargo nextest run --locked ${testRun}\n''; }"
  - "{ a = ''\n  cargo +nightly --locked nextest --color never run -p x\n''; }"
  - "{ a = ''\n  ${pkgs.cargo}/bin/cargo nextest r\n''; }"
  - "{ a = ''\n  ${lib.getExe pkgs.cargo-nextest} nextest run\n''; }"
  - "{ a = ''\n  ${jq} -r . <x\n  cargo nextest \\\n    run --profile ci\n''; }"
  - "{ a = ''\n  \"$CARGO\" nextest run>tests.log\n''; }"
  - "{ checkPhaseCargoCommand = \"cargo nextest run --locked\"; }"
  - "{ checks.tests = craneLib.cargoNextest daemon; }"
  - "{ a = ''\n  echo ${if x then \"cargo nextest run\" else \"\"}\n''; }"
