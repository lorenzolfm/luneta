id: untested-bins-hold-no-tests
valid:
  - "fn main() {}"
  - "#[cfg(target_os = \"linux\")] fn only_linux() {}"
  - "#[cfg(feature = \"testing\")] fn testing_feature() {}"
  - "#[allow(clippy::test_attr_in_doctest)] fn allowed() {}"
  - "mod inner { fn helper() {} }"
invalid:
  - "#[test] fn unit() {}"
  - "#[::core::prelude::v1::test] fn core_unit() {}"
  - "#[tokio::test] async fn async_unit() {}"
  - "#[::tokio::test] async fn qualified_async_unit() {}"
  - "#[tokio::test(flavor = \"multi_thread\")] async fn mt_unit() {}"
  - "#[cfg(test)] mod tests {}"
  - "#![cfg(test)]"
  - "#[cfg(all(unix, test))] mod unix_tests {}"
  - "#[cfg_attr(test, allow(dead_code))] fn helper() {}"
  - "mod helper;"
  - "#[path = \"other.rs\"] mod other;"
