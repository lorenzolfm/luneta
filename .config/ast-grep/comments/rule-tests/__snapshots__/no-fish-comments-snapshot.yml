id: no-fish-comments
snapshots:
  ? |-
    # a
    echo
  : labels:
    - source: '# a'
      style: primary
      start: 0
      end: 3
  'echo a # b':
    labels:
    - source: '# b'
      style: primary
      start: 7
      end: 10
  ? |-
    function f
        # a
    end
  : labels:
    - source: '# a'
      style: primary
      start: 15
      end: 18
