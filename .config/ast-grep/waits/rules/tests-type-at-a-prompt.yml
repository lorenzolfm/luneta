id: tests-type-at-a-prompt
language: rust
files:
  - crates/*/tests/**
message: >-
  A test types into a shell only once it prompts: open it as
  lune_waits::shell::AT_A_PROMPT, or end a script in shell::SCRIPT, and wait
  for shell::prompted before the first key. A shell's first frame comes
  before it reads, and keys sent then land ahead of its prompt.
rule:
  any:
    - kind: array_expression
      regex: ^\[\s*"(/bin/)?sh"\s*\]$
      not:
        inside:
          kind: field_expression
    - kind: token_tree
      regex: ^\[\s*"(/bin/)?sh"(\.to_owned\(\)|\.to_string\(\)|\.into\(\))?\s*\]$
      inside:
        kind: macro_invocation
        has:
          field: macro
          regex: ^vec$
    - kind: string_literal
      regex: \bexec\s+(/bin/)?sh\s*(;|"$)
