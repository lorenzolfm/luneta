id: tests-wait-on-events
valid:
  - "fn f(span: Duration) {}"
  - "fn f() { luneta_waits::eventually(\"a\", || Some(())); }"
  - "fn f() { let began = Began::now(); began.lasted().at_least(ALONE, \"a\"); }"
  - "fn f() { g(QUIET.saturating_mul(2)); }"
  - "use std::time::Duration;"
  - "fn f() { let at = SystemTime::now().duration_since(UNIX_EPOCH); }"
invalid:
  - "fn f() { thread::sleep(d); }"
  - "fn f() { std::thread::sleep(d); }"
  - "fn f() { std::thread::sleep_ms(5); }"
  - "async fn f() { tokio::time::sleep(d).await; }"
  - "async fn f() { tokio::time::timeout(d, g()).await; }"
  - "fn f() { sleep(d); }"
  - "fn f() { let d = Duration::from_secs(1); }"
  - "fn f() { let d = std::time::Duration::from_millis(1); }"
  - "fn f() { let d = time::Duration::from_millis(1); }"
  - "fn f() { let d = tokio::time::Duration::from_millis(1); }"
  - "fn f() { g(Duration::ZERO); }"
  - "use std::time::Duration as Span;"
  - "fn f() { heard.recv_timeout(d); }"
  - "fn f() { let _ = Receiver::recv_timeout(&heard, d); }"
  - "fn f() { std::thread::park_timeout(d); }"
  - "use std::time::Instant;"
  - "fn f() { let began = Instant::now(); }"
  - "fn f(began: Option<Instant>) {}"
  - "fn f() { assert!(began.elapsed() < QUIET); }"
  - "fn f() { let took = SystemTime::now().elapsed(); }"
