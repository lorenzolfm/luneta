[package]
name = "luneta-mux"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "luneta's own multiplexer: a server that holds the pseudoterminals of its sessions and reads each pane's program as Ghostty does"

[dependencies]
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf" }
libghostty-vt-sys = { git = "https://github.com/uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf", features = ["pkg-config"] }
percent-encoding = "2.3.2"
prost = "0.14.4"
prost-types = "0.14.4"
rustix = { version = "1.1.4", features = ["event", "fs", "process", "pty", "system", "termios"] }
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
