[package]
name = "luned"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "The lune daemon: the projects and views of this machine, the terminals of lune-mux that show them, and what the agents in them do, served to lune and the phone"

[[bin]]
name = "luned"
path = "src/bin/luned.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lune-domain = { path = "../domain" }
lune-protocol = { path = "../protocol" }
notify = "8.2.0"
prost = "0.14.4"
prost-types = "0.14.4"
rustix = { version = "1.1.4", features = ["event", "fs", "param", "process", "pty", "system", "termios", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
uzers = { version = "0.12.2", default-features = false }
wt = { git = "https://github.com/lorenzolfm/wt", rev = "b73f7d36d8f6f6c9301da9568de82ec8bd917cce" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22.1"
lune-mux = { path = "../mux" }
lune-phone = { path = "../phone" }
lune-waits = { path = "../waits" }
rustix = { version = "1.1.4", features = ["fs", "pty", "termios"] }

[lints]
workspace = true
