[package]
name = "lunetad"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "The luneta daemon, and luneta: its terminals beside a sidebar of the host, and the CLI that asks the daemon"

[[bin]]
name = "lunetad"
path = "src/bin/lunetad.rs"

[[bin]]
name = "luneta"
path = "src/bin/luneta/main.rs"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.2"
crossterm = "0.29.0"
fuzzy-matcher = { version = "0.3.7", default-features = false }
hyper-util = { version = "0.1.21", features = ["tokio"] }
luneta-protocol = { path = "../protocol" }
notify = "8.2.0"
prost = "0.14.4"
prost-types = "0.14.4"
ptts = { version = "=0.6.0", features = ["hf"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.4", features = ["event", "fs", "param", "process", "pty", "system", "termios", "time"] }
signal-hook = "0.3.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "process", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
transcribe-cpp = "=0.4.1"
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.2", default-features = false }
uzers = { version = "0.12.2", default-features = false }
xn = "=0.2.13"
wt = { git = "https://github.com/lorenzolfm/wt", rev = "b73f7d36d8f6f6c9301da9568de82ec8bd917cce" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
alsa = "0.11.0"
zbus ={ version = "6.2.1", default-features = false, features = ["proxy", "tokio"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
luneta-waits = { path = "../waits" }
rustix = { version = "1.1.4", features = ["fs", "pty", "termios"] }

[lints]
workspace = true
