syntax = "proto3";

package lune.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "lune/mux/v1/mux.proto";

service Daemon {
  rpc Info(google.protobuf.Empty) returns (InfoResponse);
  rpc ListAgents(google.protobuf.Empty) returns (ListAgentsResponse);
  rpc Watch(WatchRequest) returns (Host);
  rpc WatchChanges(WatchChangesRequest) returns (WatchResponse);
  rpc WatchLocalChanges(WatchLocalChangesRequest) returns (WatchLocalResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc KeepChecks(KeepChecksRequest) returns (stream KeepChecksResponse);
  rpc KeepPrinted(KeepPrintedRequest) returns (KeepPrintedResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc ListContents(ListContentsRequest) returns (ListContentsResponse);
  rpc TranscriptEnds(TranscriptEndsRequest) returns (TranscriptEndsResponse);
  rpc Ask(AskRequest) returns (stream AskResponse);
  rpc AskReview(AskReviewRequest) returns (stream AskResponse);
  rpc Paste(PasteRequest) returns (stream PasteResponse);
  rpc KeepImage(stream KeepImageRequest) returns (stream KeepImageResponse);
  rpc Say(SayRequest) returns (google.protobuf.Empty);
  rpc Prunes(PrunesRequest) returns (stream PrunesResponse);
  rpc Prune(PruneRequest) returns (stream PruneResponse);
  rpc Rebase(RebaseRequest) returns (stream RebaseResponse);
  rpc FileIssue(FileIssueRequest) returns (stream FileIssueResponse);
  rpc IssueRepositories(IssueRepositoriesRequest) returns (IssueRepositoriesResponse);
  rpc ChangeProjects(ChangeProjectsRequest) returns (ChangeProjectsResponse);
  rpc MakeWorktree(MakeWorktreeRequest) returns (stream MakeWorktreeResponse);
  rpc ListWork(ListWorkRequest) returns (stream ListWorkResponse);
  rpc ReadDiff(ReadDiffRequest) returns (stream ReadDiffResponse);
  rpc Show(stream ShowRequest) returns (stream ShowResponse);
  rpc Frames(stream FramesRequest) returns (stream lune.mux.v1.ToViewer);
  rpc Waiting(WaitingRequest) returns (WaitingResponse);
  rpc Answer(AnswerRequest) returns (google.protobuf.Empty);
  rpc ListResume(ListResumeRequest) returns (ListResumeResponse);
  rpc ReloadResume(ReloadResumeRequest) returns (ReloadResumeResponse);
}

message On {
  string destination = 1;
}

message ListSkillsRequest {
  On on = 1;
  string dir = 2;
  optional Harness harness = 3;
}

message ListSkillsResponse {
  repeated Skill skills = 1;

  message Skill {
    string name = 1;
    string description = 2;
    bool only_you = 3;
  }
}

message PrintedFile {
  string path = 1;
  uint64 lines = 2;
  uint64 left_out = 3;
}

message KeepPrintedRequest {
  On on = 1;
  TerminalKey terminal = 2;
  string typed = 3;
}

message KeepPrintedResponse {
  oneof printed {
    PrintedFile after = 1;
    google.protobuf.Empty nothing = 2;
    PrintedFile unsure = 3;
    Top top = 4;
  }

  message Top {
    optional PrintedFile kept = 1;
  }
}

message KeepChecksRequest {
  On on = 1;
  string url = 2;
}

message KeepChecksResponse {
  string head = 1;
  repeated Failed failed = 2;
  uint32 pending = 3;
  uint32 passed = 4;

  message Failed {
    string name = 1;
    string link = 2;
    oneof log {
      PrintedFile kept = 3;
      string unkept = 4;
    }
  }
}

message ListRepositoriesRequest {
  On on = 1;
}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
  repeated string unread = 2;
  repeated string owned = 3;

  message Repository {
    string path = 1;
  }
}

message ListContentsRequest {
  On on = 1;
  string dir = 2;
}

message ListContentsResponse {
  string listed = 1;
}

message TranscriptEndsRequest {
  On on = 1;
  repeated string ids = 2;
  uint32 share = 3;
}

message TranscriptEndsResponse {
  map<string, string> ends = 1;
  map<string, TranscriptEnd> typed_ends = 2;

  message TranscriptEnd {
    Harness harness = 1;
    string lines = 2;
  }
}

message AskRequest {
  On on = 1;
  optional string cwd = 2;
  string words = 3;
  optional string resumed = 4;
  string highlighted = 5;
  fixed64 turn = 6;
  optional fixed64 before = 7;
  repeated uint32 marked_issues = 8;
  repeated uint32 marked_pulls = 9;
  bool review_only = 10;
}

message AskReviewRequest {
  On on = 1;
  optional string cwd = 2;
  oneof turn {
    Start start = 3;
    FollowUp follow_up = 4;
  }

  message Start {
    string context = 1;
    string words = 2;
  }

  message FollowUp {
    string resumed = 1;
    string words = 2;
  }
}

message AskResponse {
  oneof step {
    string session = 1;
    Ran ran = 2;
    string denied = 3;
    string said = 4;
  }

  message Ran {
    string id = 1;
    string command = 2;
  }
}

message KeepImageRequest {
  oneof part {
    Image image = 1;
    bytes bytes = 2;
  }

  message Image {
    On on = 1;
    uint64 size = 2;
  }
}

message KeepImageResponse {
  string path = 1;
}

message PasteRequest {
  On on = 1;
  oneof work {
    string link = 2;
    File file = 3;
  }
  repeated Worked worked = 4;
  bool at_head = 5;
  bool reads_moved_off = 6;

  message File {
    string path = 1;
    optional string from = 2;
  }

  message Worked {
    string dir = 1;
    optional string pull = 2;
    bool here = 3;
  }
}

message PasteResponse {
  oneof at {
    uint32 there = 1;
    google.protobuf.Empty unopened = 2;
  }
  string folder = 3;
  optional string branch = 4;
  optional string file = 5;
  bool at_head = 6;
  bool moved_off = 7;
}

message WatchRequest {
  Version after = 1;
  optional bool kept = 2;
  bool shown = 3;
}

enum ClientWaiter {
  CLIENT_WAITER_UNSPECIFIED = 0;
  CLIENT_WAITER_CLIENT = 1;
  CLIENT_WAITER_WINDOW = 2;
}

message WatchChangesRequest {
  Version after = 1;
  ClientWaiter waiter = 2;
}

enum DaemonStanding {
  DAEMON_STANDING_UNSPECIFIED = 0;
  DAEMON_STANDING_IDLE = 1;
  DAEMON_STANDING_KEPT = 2;
  DAEMON_STANDING_WINDOW = 3;
}

message LocalVersion {
  uint32 pid = 1;
  uint64 seq = 2;
}

message WatchLocalChangesRequest {
  LocalVersion after = 1;
  DaemonStanding standing = 2;
}

message WatchResponse {
  oneof answer {
    Host host = 1;
    Version unchanged = 2;
  }
}

message LocalHost {
  LocalVersion version = 1;
  Remote.Host host = 2;
}

message WatchLocalResponse {
  oneof answer {
    LocalHost host = 1;
    LocalVersion unchanged = 2;
  }
}

message Version {
  uint32 pid = 1;
  uint64 seq = 2;
}

message Host {
  Version version = 1;
  repeated GitStatus git_statuses = 2;
  repeated Agent agents = 3;
  uint32 unread = 4;
  repeated PullRequest pull_requests = 5;
  repeated UnreadFile unread_files = 6;
  repeated Remote remotes = 7;
  optional uint32 unread_hosts = 8;
  repeated Saying sayings = 9;
  Projects projects = 10;
}

message Say {
  oneof does {
    Utterance in_turn = 1;
    Utterance now = 2;
    google.protobuf.Empty stop = 3;
  }
}

message Utterance {
  string text = 1;
}

message SayRequest {
  Say say = 1;
}

message Saying {
  uint32 pid = 1;
  uint64 number = 2;
  Say say = 3;
}

message Remote {
  string destination = 1;
  oneof reached {
    google.protobuf.Empty reaching = 2;
    Host host = 3;
    Unreached unreached = 4;
    google.protobuf.Empty here = 5;
  }

  message Host {
    repeated GitStatus git_statuses = 1;
    repeated Agent agents = 2;
    uint32 unread = 3;
    repeated PullRequest pull_requests = 4;
    repeated UnreadFile unread_files = 5;
    repeated Saying sayings = 6;
    Projects projects = 7;
  }

  message Unreached {
    google.protobuf.Timestamp since = 1;
    string why = 2;
    oneof stopped {
      google.protobuf.Empty unstarted = 3;
      Ended ended = 4;
      google.protobuf.Empty said = 5;
      google.protobuf.Empty silent = 6;
      google.protobuf.Empty lost = 7;
      google.protobuf.Empty unwatched = 8;
      google.protobuf.Empty unmatched = 10;
    }
    Projects projects = 9;
    optional string ssh_said = 11;

    message Ended {
      optional int32 code = 1;
    }
  }
}

message Titled {
  optional string topic = 1;
}

message Shell {
  oneof doing {
    Going going = 1;
    Ended ended = 2;
    Stopped stopped = 3;
    google.protobuf.Empty ready = 4;
  }

  message Going {
    optional string command = 1;
    google.protobuf.Timestamp since = 2;
    Front front = 3;
  }

  message Ended {
    optional string command = 1;
    google.protobuf.Timestamp at = 2;
    oneof ending {
      int32 status = 3;
      google.protobuf.Empty resumed = 4;
    }
    google.protobuf.Duration took = 5;
  }

  message Stopped {
    optional string command = 1;
    google.protobuf.Timestamp at = 2;
  }
}

enum Front {
  FRONT_UNSPECIFIED = 0;
  FRONT_WORKING = 1;
  FRONT_ASKING = 2;
  FRONT_INTERACTIVE = 3;
}

message GitStatus {
  string dir = 1;
  oneof stands {
    google.protobuf.Empty outside = 2;
    Checkout checkout = 3;
    NoCheckout no_checkout = 4;
  }

  message NoCheckout {
    string repository = 1;
  }
}

message Checkout {
  oneof head {
    google.protobuf.Empty detached = 1;
    Branch branch = 2;
  }
  Changes changes = 3;
  uint32 stashes = 4;
  optional string repository = 5;
}

message Branch {
  string name = 1;
  Upstream upstream = 2;
  Changed changed = 3;
}

message Changed {
  uint32 added = 1;
  uint32 deleted = 2;
}

message Changes {
  uint32 conflicted = 1;
  uint32 deleted = 2;
  uint32 renamed = 3;
  uint32 modified = 4;
  uint32 staged = 5;
  uint32 untracked = 6;
}

message Upstream {
  uint32 ahead = 1;
  uint32 behind = 2;
}

message PullRequest {
  string dir = 1;
  PullRequestState state = 2;
  string url = 3;
  Checks checks = 4;
  bool stale = 5;
}

message Checks {
  uint32 pending = 1;
  uint32 failed = 2;
  uint32 passed = 3;
}

enum PullRequestState {
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_STATE_OPEN = 1;
  PULL_REQUEST_STATE_DRAFT = 2;
  PULL_REQUEST_STATE_MERGED = 3;
  PULL_REQUEST_STATE_CLOSED = 4;
}

message InfoResponse {
  string version = 1;
  uint32 pid = 2;
  google.protobuf.Timestamp started_at = 3;
  optional bytes claude_folder = 5;
  optional uint64 built = 6;
  optional bytes agy_folder = 7;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  uint32 unread = 2;
  repeated UnreadFile unread_files = 3;
}

message UnreadFile {
  uint32 pid = 1;
  TerminalKey terminal = 2;
}

message Agent {
  uint32 pid = 1;
  optional string session_id = 2;
  string cwd = 3;
  oneof status {
    Status known_status = 4;
    string other_status = 5;
  }
  google.protobuf.Timestamp status_since = 6;
  google.protobuf.Timestamp started_at = 7;
  Name name = 8;
  optional string entrypoint = 9;
  TerminalKey terminal = 10;
  oneof waiting_for {
    WaitingFor known_waiting_for = 11;
    string other_waiting_for = 12;
  }
  optional Harness harness = 13;
  optional string topic = 14;
  oneof reported_status {
    google.protobuf.Empty working = 15;
    google.protobuf.Empty idle = 16;
    google.protobuf.Empty stopped = 17;
    DoneStatus done = 18;
    BlockedStatus blocked = 19;
    ErrorStatus error = 20;
    google.protobuf.Empty shell = 21;
    string other_reported_status = 22;
  }
  optional StatusRung status_rung = 23;
  repeated Subagent subagents = 24;
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_PI = 2;
  HARNESS_ANTIGRAVITY = 3;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_BUSY = 1;
  STATUS_IDLE = 2;
  STATUS_WAITING = 3;
  STATUS_SHELL = 4;
  STATUS_DONE = 5;
  STATUS_ERROR = 6;
  STATUS_STOPPED = 7;
}

enum WaitingFor {
  WAITING_FOR_UNSPECIFIED = 0;
  WAITING_FOR_PERMISSION_PROMPT = 1;
  WAITING_FOR_INPUT_NEEDED = 2;
  WAITING_FOR_DIALOG_OPEN = 3;
  WAITING_FOR_AUTH = 4;
}

message WorkingStatus {
  optional uint32 progress = 1;
}

message DoneStatus {
  optional string message = 1;
}

message BlockedStatus {
  oneof reason {
    WaitingFor known = 1;
    string other = 2;
  }
  optional string message = 3;
}

message ErrorStatus {
  optional string message = 1;
}

enum StatusRung {
  STATUS_RUNG_UNSPECIFIED = 0;
  STATUS_RUNG_OSC_7501 = 1;
  STATUS_RUNG_FEED = 2;
  STATUS_RUNG_EXTENSION = 3;
  STATUS_RUNG_HOOK = 4;
  STATUS_RUNG_TRANSCRIPT = 5;
  STATUS_RUNG_SCREEN = 6;
}

message Subagent {
  string id = 1;
  oneof phase {
    google.protobuf.Empty idle = 2;
    google.protobuf.Empty stopped = 3;
    WorkingStatus working = 4;
    DoneStatus done = 5;
    BlockedStatus blocked = 6;
    ErrorStatus error = 7;
    google.protobuf.Empty shell = 8;
    string other = 9;
  }
  optional string title = 10;
  google.protobuf.Timestamp status_since = 11;
}

message Name {
  string text = 1;
  optional NameSource source = 2;
}

enum NameSource {
  NAME_SOURCE_UNSPECIFIED = 0;
  NAME_SOURCE_USER = 1;
  NAME_SOURCE_PEER = 2;
  NAME_SOURCE_DERIVED = 3;
  NAME_SOURCE_COLLISION = 4;
  NAME_SOURCE_AUTO = 5;
  NAME_SOURCE_HOOK = 6;
  NAME_SOURCE_OTHER = 7;
}

message PrunesRequest {
  On on = 1;
  string dir = 2;
}

message PrunesResponse {
  string repository = 1;
  repeated Goes goes = 2;
  repeated Kept kept = 3;
  repeated Unasked unasked = 4;

  message Goes {
    string folder = 1;
    string branch = 2;
    string head = 3;
    uint32 number = 4;
    oneof pushed {
      RemoteBranch remote = 5;
      string stays = 6;
    }
    optional uint64 bytes = 7;
  }

  message RemoteBranch {
    string remote = 1;
    string branch = 2;
  }

  message Kept {
    string folder = 1;
    uint32 number = 2;
    string why = 3;
  }

  message Unasked {
    string folder = 1;
    string why = 2;
  }
}

message PruneRequest {
  On on = 1;
  string dir = 2;
  repeated Deleting agreed = 3;

  message Deleting {
    string folder = 1;
    string branch = 2;
    string head = 3;
    uint32 number = 4;
    PrunesResponse.RemoteBranch remote = 5;
  }
}

message PruneResponse {
  oneof answer {
    PrunesResponse changed = 1;
    Outcomes deleted = 2;
  }

  message Outcomes {
    repeated Outcome outcomes = 1;
  }

  message Outcome {
    string folder = 1;
    oneof came {
      google.protobuf.Empty gone = 2;
      string went_but = 3;
      string stays = 4;
    }
  }
}

message RebaseRequest {
  On on = 1;
  string dir = 2;
  optional string branch = 3;
}

message RebaseResponse {
  string branch = 1;
  string onto = 2;
  oneof came {
    google.protobuf.Empty already = 3;
    Clean clean = 4;
    Stopped stopped = 5;
  }
  oneof status_refresh {
    LocalVersion refreshed_at = 6;
    google.protobuf.Empty untracked = 7;
    google.protobuf.Empty stale = 8;
  }

  message Clean {
    uint32 ahead = 1;
  }

  message Stopped {
    optional string at = 1;
    repeated string conflicted = 2;
    uint32 conflicted_count = 3;
  }
}

message FileIssueRequest {
  On on = 1;
  string dir = 2;
  string words = 3;
  string repository = 4;
}

message FileIssueResponse {
  string url = 1;
  string title = 2;
}

message IssueRepositoriesRequest {
  On on = 1;
  string dir = 2;
}

message IssueRepositoriesResponse {
  repeated IssueRepository repositories = 1;
}

message IssueRepository {
  string remote = 1;
  string repository = 2;
}

message Projects {
  oneof held {
    Kept kept = 1;
    string unkept = 2;
  }

  message Kept {
    repeated Project projects = 1;
    Version version = 2;
  }
}

message Project {
  fixed64 id = 1;
  string name = 2;
  string dir = 3;
  bool missing = 4;
  oneof holds {
    Worktree folder = 5;
    Clone clone = 6;
  }

  message Clone {
    repeated Worktree worktrees = 1;
    oneof listing {
      string unlisted = 2;
      Unopened unopened = 3;
    }
  }

  message Unopened {
    repeated string subfolders = 1;
  }
}

message Worktree {
  fixed64 id = 1;
  string name = 2;
  bool renamed = 3;
  string folder = 4;
  oneof seen {
    google.protobuf.Empty missing = 5;
    Stage stage = 6;
    google.protobuf.Empty unread = 7;
  }
  repeated Terminal terminals = 8;
  google.protobuf.Timestamp used_at = 9;
  optional Arrangement arranged = 10;
}

message Terminal {
  fixed64 id = 1;
  oneof found {
    TerminalKey key = 2;
    google.protobuf.Empty lost = 3;
    google.protobuf.Empty looking = 4;
  }
  string folder = 5;
  optional string command = 6;
  Titled titled = 7;
  Shell shell = 8;
  bool held = 9;
  optional string name = 10;
  oneof state {
    Running running = 11;
    Ended ended = 12;
    TerminalKey unlisted = 13;
    google.protobuf.Empty state_lost = 14;
    google.protobuf.Empty state_looking = 15;
  }

  message Running {
    TerminalKey key = 1;
    optional string command = 2;
    Titled titled = 3;
    Shell shell = 4;
  }

  message Ended {
    TerminalKey key = 1;
    Titled titled = 2;
  }
}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_NO_BRANCH = 1;
  STAGE_WORKING = 2;
  STAGE_PULL_REQUEST_OPEN = 3;
  STAGE_CHECKS_FAILING = 4;
  STAGE_MERGED = 5;
}

enum Arrangement {
  ARRANGEMENT_UNSPECIFIED = 0;
  ARRANGEMENT_TABS = 1;
  ARRANGEMENT_PANES = 2;
}

message Opens {
  oneof runs {
    google.protobuf.Empty shell = 1;
    Argv command = 2;
    Prompted agent = 3;
  }
}

message Prompted {
  Harness harness = 1;
  string words = 2;
}

message Argv {
  repeated string words = 1;
}

message ChangeProjectsRequest {
  On on = 1;
  oneof change {
    AddProject add_project = 2;
    AddWorktree add_worktree = 3;
    Start start = 4;
    Join join = 5;
    Pull pull = 6;
    RenameProject rename_project = 7;
    RenameWorktree rename_worktree = 8;
    RenameTerminal rename_terminal = 9;
    ReorderProjects reorder_projects = 10;
    ReorderWorktrees reorder_worktrees = 11;
    ForgetProject forget_project = 12;
    CloseProject close_project = 13;
    CloseWorktree close_worktree = 14;
    Bring bring = 15;
    CloseView close_view = 16;
    OpenBrowser open_browser = 17;
    ReviveView revive_view = 18;
  }

  message AddProject {
    string dir = 1;
    optional string name = 2;
  }

  message AddWorktree {
    fixed64 project = 1;
    string folder = 2;
    optional string name = 3;
    Opens opens = 4;
  }

  message Start {
    string folder = 1;
    optional string name = 2;
  }

  message Join {
    string folder = 1;
    Opens opens = 2;
  }

  message Pull {
    string folder = 1;
    string name = 2;
    Argv agent = 3;
  }

  message RenameProject {
    fixed64 project = 1;
    string to = 2;
  }

  message RenameWorktree {
    fixed64 worktree = 1;
    optional string to = 2;
  }

  message RenameTerminal {
    fixed64 terminal = 1;
    optional string to = 2;
  }

  message ReorderProjects {
    repeated fixed64 projects = 1;
    repeated fixed64 seen = 2;
  }

  message ReorderWorktrees {
    fixed64 project = 1;
    repeated fixed64 worktrees = 2;
    repeated fixed64 seen = 3;
  }

  message ForgetProject {
    fixed64 project = 1;
  }

  message CloseProject {
    fixed64 project = 1;
    repeated fixed64 worktrees = 2;
    repeated fixed64 seen = 3;
  }

  message CloseWorktree {
    fixed64 worktree = 1;
    repeated fixed64 seen = 2;
  }

  message Bring {
    fixed64 worktree = 1;
    TerminalKey from = 2;
  }

  message CloseView {
    TerminalKey terminal = 1;
  }

  message OpenBrowser {
    oneof target {
      InWorktree worktree = 1;
      FromTerminal from = 2;
      string folder = 3;
    }
    optional string url = 4;

    message InWorktree {
      fixed64 worktree = 1;
      TerminalKey from = 2;
    }

    message FromTerminal {
      TerminalKey from = 1;
      optional string fallback_folder = 2;
    }
  }

  message ReviveView {}
}

message ChangeProjectsResponse {
  oneof made {
    fixed64 project = 1;
    fixed64 worktree = 2;
    fixed64 found = 3;
    fixed64 taken = 4;
    google.protobuf.Empty untaken = 6;
  }
  Version kept = 5;
  oneof opened {
    fixed64 view = 7;
    string unopened = 8;
  }
}

message MakeWorktreeRequest {
  On on = 1;
  fixed64 project = 2;
  string branch = 3;
  Opens opens = 4;
}

message MakeWorktreeResponse {
  oneof landed {
    fixed64 made = 1;
    fixed64 found = 2;
    fixed64 started = 3;
  }
}

message ListWorkRequest {
  On on = 1;
  fixed64 project = 2;
}

message ListWorkResponse {
  oneof listed {
    Work work = 1;
    google.protobuf.Empty unhosted = 2;
  }

  message Work {
    oneof issues {
      OpenIssues open = 1;
      google.protobuf.Empty off = 2;
    }
    repeated Pull pulls = 3;
    bool more_pulls = 4;
  }

  message OpenIssues {
    repeated Issue issues = 1;
    bool more = 2;
  }

  message Issue {
    uint32 number = 1;
    string title = 2;
    repeated string labels = 3;
  }

  message Pull {
    uint32 number = 1;
    string title = 2;
    bool draft = 3;
    string branch = 4;
    optional string author = 5;
  }
}

message ReadDiffRequest {
  On on = 1;
  fixed64 worktree = 2;
}

message ReadDiffResponse {
  string base = 1;
  string head = 2;
  bytes patch = 3;
  bool truncated = 4;
  repeated Untracked untracked = 5;

  message Untracked {
    string path = 1;
    string content = 2;
  }
}

message ShowRequest {
  oneof event {
    Hello hello = 1;
    Size size = 2;
    fixed64 go = 3;
    Open open = 4;
    fixed64 close = 5;
    Focus focus = 6;
    Resize resize = 7;
    Move move = 8;
    google.protobuf.Empty fullscreen = 9;
    google.protobuf.Empty welcome = 10;
    Arrangement arrange = 11;
    google.protobuf.Empty review = 12;
    Browser browser = 13;
    Navigate navigate = 14;
    BrowserTty browser_tty = 15;
  }
  fixed64 asked = 16;

  message Browser {
    optional string url = 1;
  }

  message Navigate {
    fixed64 view = 1;
    optional string url = 2;
  }

  message BrowserTty {
    fixed64 view = 1;
    optional string tty = 2;
  }

  message Hello {
    fixed64 worktree = 1;
    Size size = 2;
    TerminalKey runs_in = 3;
    bool again = 4;
    On on = 5;
  }

  message Size {
    uint32 columns = 1;
    uint32 rows = 2;
  }

  message Open {
    oneof beside {
      google.protobuf.Empty largest = 1;
      Towards towards = 2;
      google.protobuf.Empty focused = 3;
      google.protobuf.Empty alone = 4;
    }
    Opens opens = 5;
  }

  message Focus {
    oneof to {
      Direction direction = 1;
      Order order = 2;
      fixed64 view = 3;
    }
    fixed64 step = 4;
  }

  message Resize {
    oneof sides {
      Direction direction = 1;
      google.protobuf.Empty every = 2;
    }
    Growth growth = 3;
  }

  message Move {
    oneof to {
      Direction direction = 1;
      Order order = 2;
    }
  }

  enum Towards {
    TOWARDS_UNSPECIFIED = 0;
    TOWARDS_RIGHT = 1;
    TOWARDS_DOWN = 2;
  }

  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_LEFT = 1;
    DIRECTION_RIGHT = 2;
    DIRECTION_UP = 3;
    DIRECTION_DOWN = 4;
  }

  enum Order {
    ORDER_UNSPECIFIED = 0;
    ORDER_NEXT = 1;
    ORDER_PREVIOUS = 2;
  }

  enum Growth {
    GROWTH_UNSPECIFIED = 0;
    GROWTH_GROW = 1;
    GROWTH_SHRINK = 2;
  }
}

message FramesRequest {
  oneof event {
    Hello hello = 1;
    lune.mux.v1.FromViewer said = 2;
  }

  message Hello {
    On on = 1;
    lune.mux.v1.Greeting greeting = 2;
  }
}

message ShowResponse {
  oneof event {
    Laid laid = 1;
    string refused = 2;
    Edged edged = 3;
    fixed64 sent = 4;
    fixed64 left = 5;
  }
  fixed64 heard = 6;

  message Edged {
    fixed64 worktree = 1;
    ShowRequest.Direction direction = 2;
    fixed64 step = 3;
  }

  message Laid {
    fixed64 worktree = 1;
    ShowRequest.Size size = 2;
    repeated View views = 3;
    oneof shown {
      fixed64 tiled = 4;
      fixed64 full = 5;
      fixed64 tabbed = 6;
    }
    Version version = 7;
  }

  message View {
    fixed64 id = 1;
    Rect rect = 2;
    oneof found {
      TerminalKey key = 3;
      google.protobuf.Empty lost = 4;
      google.protobuf.Empty looking = 5;
      google.protobuf.Empty welcome = 6;
      google.protobuf.Empty review = 7;
      Browser browser = 8;
    }

    message Browser {
      optional string url = 1;
    }
  }

  message Rect {
    uint32 column = 1;
    uint32 row = 2;
    uint32 columns = 3;
    uint32 rows = 4;
  }
}

message TerminalKey {
  uint32 id = 1;
  google.protobuf.Timestamp made_at = 2;
}

message WaitingRequest {
  On on = 1;
  TerminalKey terminal = 2;
}

message WaitingResponse {
  string screen = 1;
  uint64 shown = 2;
  oneof asks {
    google.protobuf.Empty words = 3;
    Menu menu = 4;
    string unread = 5;
  }
  optional string said = 6;

  message Menu {
    repeated string choices = 1;
    uint32 chosen = 2;
  }
}

message AnswerRequest {
  On on = 1;
  TerminalKey terminal = 2;
  optional uint64 shown = 6;
  oneof answer {
    string text = 3;
    Choice choice = 4;
    google.protobuf.Empty escape = 5;
  }

  message Choice {
    uint32 index = 1;
    string label = 2;
  }
}

message ListResumeRequest {
  On on = 1;
  optional uint32 terminal_id = 2;
}

message ListResumeResponse {
  optional string config_path = 1;
  repeated string config_warnings = 2;
  oneof config {
    LoadedResumeConfig loaded = 3;
    string error = 4;
  }
  repeated TerminalResumeRecords terminals = 5;
}

message LoadedResumeConfig {
  repeated ResumeRuleInfo rules = 1;
  repeated DisabledRuleInfo disabled_rules = 2;
}

message ReloadResumeRequest {
  On on = 1;
}

message ReloadResumeResponse {
  optional string config_path = 1;
  repeated string warnings = 2;
  oneof outcome {
    uint32 reloaded_rules = 3;
    Failed failed = 4;
  }

  message Failed {
    string error = 1;
    optional uint32 kept_previous_rules = 2;
  }
}

message ResumeRuleInfo {
  string name = 1;
  bool builtin = 2;
  string command = 3;
  repeated string dirs = 4;
  optional FlagSummary flags = 5;
  repeated string overrides = 6;

  message FlagSummary {
    uint32 kept = 1;
    uint32 dropped = 2;
  }
}

message DisabledRuleInfo {
  string name = 1;
  string reason = 2;
}

message TerminalResumeRecords {
  oneof owner {
    LayoutTerminal layout = 1;
    TerminalKey untracked = 2;
  }
  string folder = 3;
  repeated ResumeRecordInfo records = 4;

  message LayoutTerminal {
    fixed64 view_id = 1;
    optional TerminalKey terminal = 2;
  }
}

message ResumeRecordInfo {
  ResumeRecordSource source = 1;
  uint32 owner_pid = 2;
  string owner_name = 3;
  repeated string argv = 4;
  oneof cwd {
    string explicit_cwd = 5;
    string inferred_cwd = 6;
  }
  ResumePlacement placement = 7;
  bool chosen = 8;
  ResumePersistence persistence = 9;
  google.protobuf.Timestamp reported_at = 10;
  oneof verdict {
    string trusted_rule = 11;
    Untrusted untrusted = 12;
  }

  message Untrusted {
    oneof detail {
      GlobalTrustReason global = 1;
      RuleRejected by_rule = 2;
    }
  }

  message RuleRejected {
    string rule = 1;
    RuleTrustReason reason = 2;
  }
}

enum ResumePlacement {
  RESUME_PLACEMENT_UNSPECIFIED = 0;
  RESUME_PLACEMENT_ROOT = 1;
  RESUME_PLACEMENT_SHELL_HOSTED = 2;
  RESUME_PLACEMENT_WRAPPED = 3;
}

enum ResumePersistence {
  RESUME_PERSISTENCE_UNSPECIFIED = 0;
  RESUME_PERSISTENCE_UNSAVED = 1;
  RESUME_PERSISTENCE_SAVED = 2;
  RESUME_PERSISTENCE_TRIED = 3;
}

enum ResumeRecordSource {
  RESUME_RECORD_SOURCE_UNSPECIFIED = 0;
  RESUME_RECORD_SOURCE_OSC_7577 = 1;
  RESUME_RECORD_SOURCE_SYNTHESIZED = 2;
}

enum GlobalTrustReason {
  GLOBAL_TRUST_REASON_UNSPECIFIED = 0;
  GLOBAL_TRUST_REASON_CONFIG_INCOMPLETE = 1;
  GLOBAL_TRUST_REASON_NO_RULE = 2;
  GLOBAL_TRUST_REASON_ROOT = 3;
}

enum RuleTrustReason {
  RULE_TRUST_REASON_UNSPECIFIED = 0;
  RULE_TRUST_REASON_PROGRAM_DIFFERS = 1;
  RULE_TRUST_REASON_WRAPPED = 2;
  RULE_TRUST_REASON_LAUNCH_UNREADABLE = 3;
  RULE_TRUST_REASON_FLAG_NOT_LISTED = 4;
  RULE_TRUST_REASON_FLAG_VALUE = 5;
  RULE_TRUST_REASON_FLAGS_DIFFER = 6;
  RULE_TRUST_REASON_DIR_NOT_ALLOWED = 7;
}
