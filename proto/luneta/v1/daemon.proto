syntax = "proto3";

package luneta.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "luneta/mux/v1/mux.proto";

service Daemon {
  rpc Info(google.protobuf.Empty) returns (InfoResponse);
  rpc ListAgents(google.protobuf.Empty) returns (ListAgentsResponse);
  rpc Watch(WatchRequest) returns (Host);
  rpc Go(GoRequest) returns (google.protobuf.Empty);
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  rpc Refuge(RefugeRequest) returns (RefugeResponse);
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc KeepPrinted(KeepPrintedRequest) returns (KeepPrintedResponse);
  rpc KeepChecks(KeepChecksRequest) returns (stream KeepChecksResponse);
  rpc NameSession(NameSessionRequest) returns (NameSessionResponse);
  rpc CheckName(CheckNameRequest) returns (CheckNameResponse);
  rpc ListDirs(ListDirsRequest) returns (ListDirsResponse);
  rpc ListContents(ListContentsRequest) returns (ListContentsResponse);
  rpc DumpScreen(DumpScreenRequest) returns (DumpScreenResponse);
  rpc Start(StartRequest) returns (google.protobuf.Empty);
  rpc Closes(ClosesRequest) returns (ClosesResponse);
  rpc Close(CloseRequest) returns (google.protobuf.Empty);
  rpc OtherTabs(OtherTabsRequest) returns (OtherTabsResponse);
  rpc TurnIntoTab(TurnIntoTabRequest) returns (TurnIntoTabResponse);
  rpc TurnIntoPanes(TurnIntoPanesRequest) returns (TurnIntoPanesResponse);
  rpc Kill(KillRequest) returns (google.protobuf.Empty);
  rpc ListExited(ListExitedRequest) returns (ListExitedResponse);
  rpc DeleteExited(DeleteExitedRequest) returns (google.protobuf.Empty);
  rpc RenameSession(RenameSessionRequest) returns (google.protobuf.Empty);
  rpc TranscriptEnds(TranscriptEndsRequest) returns (TranscriptEndsResponse);
  rpc Ask(AskRequest) returns (stream AskResponse);
  rpc Paste(PasteRequest) returns (stream PasteResponse);
  rpc KeepImage(stream KeepImageRequest) returns (stream KeepImageResponse);
  rpc Say(SayRequest) returns (google.protobuf.Empty);
  rpc Prunes(PrunesRequest) returns (stream PrunesResponse);
  rpc Prune(PruneRequest) returns (stream PruneResponse);
  rpc FileIssue(FileIssueRequest) returns (stream FileIssueResponse);
  rpc IssueRepositories(IssueRepositoriesRequest) returns (IssueRepositoriesResponse);
  rpc ChangeProjects(ChangeProjectsRequest) returns (ChangeProjectsResponse);
  rpc Show(stream ShowRequest) returns (stream ShowResponse);
  rpc View(stream ViewRequest) returns (stream luneta.mux.v1.ToViewer);
}

message On {
  string destination = 1;
}

message GoRequest {
  On on = 1;
  string at = 2;
  string to = 3;
  optional uint32 pane = 4;
}

message ListClientsRequest {
  On on = 1;
  string session = 2;
}

message ListClientsResponse {
  repeated Client clients = 1;
}

message RefugeRequest {
  On on = 1;
  repeated string seats = 2;
}

message RefugeResponse {
  oneof ended {
    google.protobuf.Empty kept = 1;
    Went went = 2;
  }

  message Went {
    Refuge refuge = 1;
  }
}

message OpenRequest {
  On on = 1;
  string session = 2;
  string cwd = 3;
  repeated string command = 4;
  oneof opens {
    uint32 beside = 5;
    Tab tab = 6;
  }

  message Tab {
    optional string name = 1;
    google.protobuf.Timestamp alone_since = 2;
  }
}

message OpenResponse {
  uint32 terminal = 1;
  repeated string notes = 2;
}

message ListSkillsRequest {
  On on = 1;
  string dir = 2;
  optional Harness harness = 3;
}

message ListSkillsResponse {
  repeated Skill skills = 1;

  message Skill {
    string name = 1;
    string description = 2;
    bool only_you = 3;
  }
}

message KeepPrintedRequest {
  On on = 1;
  string session = 2;
  uint32 pane = 3;
  string typed = 4;
}

message KeepPrintedResponse {
  oneof printed {
    File after = 1;
    google.protobuf.Empty nothing = 2;
    File unsure = 3;
    Top top = 4;
  }

  message File {
    string path = 1;
    uint64 lines = 2;
    uint64 left_out = 3;
  }

  message Top {
    File file = 1;
  }
}

message KeepChecksRequest {
  On on = 1;
  string url = 2;
}

message KeepChecksResponse {
  string head = 1;
  repeated Failed failed = 2;
  uint32 pending = 3;
  uint32 passed = 4;

  message Failed {
    string name = 1;
    string link = 2;
    oneof log {
      KeepPrintedResponse.File kept = 3;
      string unkept = 4;
    }
  }
}

message NameSessionRequest {
  On on = 1;
  optional string dir = 2;
}

message NameSessionResponse {
  string name = 1;
  google.protobuf.Timestamp named_at = 2;
  optional string dir = 3;
}

message CheckNameRequest {
  On on = 1;
  string name = 2;
}

message CheckNameResponse {
  google.protobuf.Timestamp named_at = 1;
}

message ListDirsRequest {
  On on = 1;
}

message ListDirsResponse {
  repeated Dir dirs = 1;

  message Dir {
    string path = 1;
    string name = 2;
  }
}

message ListContentsRequest {
  On on = 1;
  string dir = 2;
}

message ListContentsResponse {
  string listed = 1;
}

message DumpScreenRequest {
  On on = 1;
  string session = 2;
  optional uint32 pane = 3;
}

message DumpScreenResponse {
  uint32 pane = 1;
  string screen = 2;
}

message StartRequest {
  On on = 1;
  string at = 2;
  string to = 3;
  optional string cwd = 4;
}

message ClosesRequest {
  On on = 1;
  string session = 2;
  uint32 pane = 3;
}

message ClosesResponse {
  oneof closes {
    google.protobuf.Empty pane = 1;
    Tab tab = 2;
    google.protobuf.Empty session = 3;
  }

  message Tab {
    uint32 id = 1;
    repeated uint32 panes = 2;
  }
}

message CloseRequest {
  On on = 1;
  string session = 2;
  oneof closes {
    uint32 pane = 3;
    ClosesResponse.Tab tab = 4;
  }
  google.protobuf.Timestamp started_at = 5;
  reserved 6, 7;
}

message OtherTabsRequest {
  On on = 1;
  string session = 2;
  uint32 pane = 3;
}

message OtherTabsResponse {
  repeated Tab tabs = 1;

  message Tab {
    uint32 pane = 1;
    string name = 2;
  }
}

message TurnIntoTabRequest {
  On on = 1;
  string session = 2;
  uint32 pane = 3;
  google.protobuf.Timestamp started_at = 4;
}

message TurnIntoTabResponse {
  oneof came {
    google.protobuf.Empty done = 1;
    google.protobuf.Empty no_client = 2;
  }
}

message TurnIntoPanesRequest {
  On on = 1;
  string session = 2;
  uint32 pane = 3;
  uint32 beside = 4;
  google.protobuf.Timestamp started_at = 5;
}

message TurnIntoPanesResponse {
  oneof came {
    google.protobuf.Empty done = 1;
    Partly partly = 2;
  }

  message Partly {
    uint32 moved = 1;
    uint32 of = 2;
    string why = 3;
  }
}

message KillRequest {
  On on = 1;
  string session = 2;
  google.protobuf.Timestamp started_at = 3;
  reserved 4, 5;
}

message ListExitedRequest {
  On on = 1;
}

message ListExitedResponse {
  repeated Exited exited = 1;

  message Exited {
    string name = 1;
    google.protobuf.Duration ago = 2;
  }
}

message DeleteExitedRequest {
  On on = 1;
  string session = 2;
}

message RenameSessionRequest {
  On on = 1;
  string session = 2;
  string to = 3;
}

message TranscriptEndsRequest {
  On on = 1;
  repeated string ids = 2;
  uint32 share = 3;
}

message TranscriptEndsResponse {
  map<string, string> ends = 1;
}

message AskRequest {
  On on = 1;
  optional string cwd = 2;
  string words = 3;
  optional string resumed = 4;
  string highlighted = 5;
  oneof user {
    UserPane pane = 6;
    google.protobuf.Empty away = 7;
  }
  reserved 11;
  fixed64 turn = 8;
  optional fixed64 before = 9;
  optional Harness agents = 10;

  message UserPane {
    string session = 1;
    uint32 pane = 2;
  }
}

message AskResponse {
  oneof step {
    string session = 1;
    Ran ran = 2;
    string denied = 3;
    string said = 4;
  }

  message Ran {
    string id = 1;
    string command = 2;
  }
}

message KeepImageRequest {
  oneof part {
    Image image = 1;
    bytes bytes = 2;
  }

  message Image {
    On on = 1;
    uint64 size = 2;
  }
}

message KeepImageResponse {
  string path = 1;
}

message PasteRequest {
  On on = 1;
  oneof work {
    string link = 2;
    File file = 4;
  }
  repeated Worked worked = 3;
  bool at_head = 5;
  bool reads_moved_off = 6;

  message File {
    string path = 1;
    optional string from = 2;
  }

  message Worked {
    string dir = 1;
    optional string pull = 2;
    bool here = 3;
  }
}

message PasteResponse {
  oneof at {
    uint32 there = 1;
    uint32 session = 2;
    Clone clone = 3;
  }
  string worktree = 4;
  optional string branch = 5;
  optional string file = 6;
  bool at_head = 7;
  bool moved_off = 8;

  message Clone {
    string cwd = 1;
    string name = 2;
  }
}

message Refuge {
  string session = 1;
  repeated Client before = 2;
}

message WatchRequest {
  Version after = 1;
  optional bool kept = 2;
  bool shown = 3;
}

message Version {
  uint32 pid = 1;
  uint64 seq = 2;
}

message Host {
  Version version = 1;
  repeated Session sessions = 2;
  repeated WorkTree work_trees = 3;
  repeated Agent agents = 4;
  uint32 unread = 5;
  repeated PullRequest pull_requests = 6;
  optional uint32 unread_sockets = 7;
  repeated UnreadFile unread_files = 8;
  repeated Remote remotes = 9;
  optional uint32 unread_hosts = 10;
  repeated Saying sayings = 11;
  Projects projects = 12;
}

message Say {
  oneof does {
    Utterance in_turn = 1;
    Utterance now = 2;
    google.protobuf.Empty stop = 3;
  }
}

message Utterance {
  string text = 1;
  optional Zellij speaker = 2;
  reserved 3;
}

message SayRequest {
  Say say = 1;
}

message Saying {
  uint32 pid = 1;
  uint64 number = 2;
  Say say = 3;
}

message Remote {
  string destination = 1;
  oneof reached {
    google.protobuf.Empty reaching = 2;
    Host host = 3;
    Unreached unreached = 4;
  }

  message Host {
    repeated Session sessions = 2;
    repeated WorkTree work_trees = 3;
    repeated Agent agents = 4;
    uint32 unread = 5;
    repeated PullRequest pull_requests = 6;
    optional uint32 unread_sockets = 7;
    repeated UnreadFile unread_files = 8;
    repeated Saying sayings = 11;
    Projects projects = 12;
  }

  message Unreached {
    google.protobuf.Timestamp since = 1;
    string why = 2;
    oneof stopped {
      google.protobuf.Empty unstarted = 3;
      Ended ended = 4;
      google.protobuf.Empty said = 5;
      google.protobuf.Empty silent = 6;
      google.protobuf.Empty lost = 7;
      google.protobuf.Empty unwatched = 8;
    }
    Projects projects = 9;

    message Ended {
      optional int32 code = 1;
    }
  }
}

message Session {
  string name = 1;
  google.protobuf.Timestamp started_at = 2;
  Panes panes = 3;
  Clients clients = 4;
  uint64 socket = 5;
  oneof mux {
    ZellijSession zellij = 7;
    OwnSession own = 8;
  }
  reserved 6;
}

message OwnSession {
  uint64 id = 1;
  google.protobuf.Timestamp made_at = 2;
}

message ZellijSession {
  google.protobuf.Timestamp started_at = 1;
  uint64 socket = 2;
}

message Panes {
  repeated Pane panes = 1;
}

message Clients {
  repeated Client clients = 1;
}

message Client {
  uint32 id = 1;
  optional uint32 pane = 2;
}

message Pane {
  uint32 id = 1;
  uint32 tab = 2;
  string tab_name = 3;
  optional string cwd = 4;
  optional string command = 5;
  Titled titled = 6;
  Shell shell = 7;
  optional uint32 tab_id = 8;
  bool held = 9;
  TerminalKey key = 10;
}

message Titled {
  optional string topic = 1;
}

message Shell {
  oneof doing {
    Going going = 1;
    Ended ended = 2;
    Stopped stopped = 3;
    google.protobuf.Empty ready = 4;
  }

  message Going {
    optional string command = 1;
    google.protobuf.Timestamp since = 2;
    Front front = 3;
  }

  message Ended {
    optional string command = 1;
    google.protobuf.Timestamp at = 2;
    oneof ending {
      int32 status = 3;
      google.protobuf.Empty resumed = 5;
    }
    google.protobuf.Duration took = 4;
  }

  message Stopped {
    optional string command = 1;
    google.protobuf.Timestamp at = 2;
  }
}

enum Front {
  FRONT_UNSPECIFIED = 0;
  FRONT_WORKING = 1;
  FRONT_ASKING = 2;
  FRONT_INTERACTIVE = 3;
}

message WorkTree {
  string dir = 1;
  oneof stands {
    google.protobuf.Empty outside = 2;
    Checkout checkout = 3;
    NoCheckout no_checkout = 4;
  }

  message NoCheckout {
    string repository = 1;
  }
}

message Checkout {
  oneof head {
    google.protobuf.Empty detached = 1;
    Branch branch = 2;
  }
  Changes changes = 3;
  uint32 stashes = 4;
  optional string repository = 5;
}

message Branch {
  string name = 1;
  Upstream upstream = 2;
  Changed changed = 3;
}

message Changed {
  uint32 added = 1;
  uint32 deleted = 2;
}

message Changes {
  uint32 conflicted = 1;
  uint32 deleted = 2;
  uint32 renamed = 3;
  uint32 modified = 4;
  uint32 staged = 5;
  uint32 untracked = 6;
}

message Upstream {
  uint32 ahead = 1;
  uint32 behind = 2;
}

message PullRequest {
  string dir = 1;
  uint32 number = 2;
  PullRequestState state = 3;
  string url = 4;
  Checks checks = 5;
  bool stale = 6;
}

message Checks {
  uint32 pending = 1;
  uint32 failed = 2;
  uint32 passed = 3;
}

enum PullRequestState {
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_STATE_OPEN = 1;
  PULL_REQUEST_STATE_DRAFT = 2;
  PULL_REQUEST_STATE_MERGED = 3;
  PULL_REQUEST_STATE_CLOSED = 4;
}

message InfoResponse {
  string version = 1;
  uint32 pid = 2;
  google.protobuf.Timestamp started_at = 3;
  optional bytes zellij_folder = 4;
  optional bytes claude_folder = 5;
  optional uint64 built = 6;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  uint32 unread = 2;
  repeated UnreadFile unread_files = 3;
}

message UnreadFile {
  uint32 pid = 1;
  Zellij zellij = 2;
  Own own = 3;
  TerminalKey terminal = 4;
}

message Agent {
  uint32 pid = 1;
  string session_id = 2;
  string cwd = 3;
  oneof status {
    Status known_status = 4;
    string other_status = 10;
  }
  google.protobuf.Timestamp status_since = 5;
  google.protobuf.Timestamp started_at = 6;
  Name name = 7;
  optional string entrypoint = 8;
  oneof pane {
    Zellij zellij = 9;
    Own own = 16;
    TerminalKey terminal = 17;
  }
  oneof waiting_for {
    WaitingFor known_waiting_for = 11;
    string other_waiting_for = 12;
  }
  optional Harness harness = 13;
  reserved 14;
  reserved "review";
  optional string topic = 15;
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_PI = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_BUSY = 1;
  STATUS_IDLE = 2;
  STATUS_WAITING = 3;
  STATUS_SHELL = 4;
}

enum WaitingFor {
  WAITING_FOR_UNSPECIFIED = 0;
  WAITING_FOR_PERMISSION_PROMPT = 1;
  WAITING_FOR_INPUT_NEEDED = 2;
  WAITING_FOR_DIALOG_OPEN = 3;
}

message Name {
  string text = 1;
  optional NameSource source = 2;
}

enum NameSource {
  NAME_SOURCE_UNSPECIFIED = 0;
  NAME_SOURCE_USER = 1;
  NAME_SOURCE_PEER = 2;
  NAME_SOURCE_DERIVED = 3;
  NAME_SOURCE_COLLISION = 4;
  NAME_SOURCE_AUTO = 5;
  NAME_SOURCE_HOOK = 6;
  NAME_SOURCE_OTHER = 7;
}

message Own {
  OwnSession session = 3;
  uint32 pane = 2;
  reserved 1;
}

message Zellij {
  string named = 1;
  optional string session = 2;
  uint32 pane = 3;
}

message PrunesRequest {
  On on = 1;
  string dir = 2;
}

message PrunesResponse {
  string repository = 1;
  repeated Goes goes = 2;
  repeated Kept kept = 3;
  repeated Unasked unasked = 4;

  message Goes {
    string worktree = 1;
    string branch = 2;
    string head = 3;
    uint32 number = 4;
    oneof pushed {
      RemoteBranch remote = 5;
      string stays = 6;
    }
    optional uint64 bytes = 7;
  }

  message RemoteBranch {
    string remote = 1;
    string branch = 2;
  }

  message Kept {
    string worktree = 1;
    uint32 number = 2;
    string why = 3;
  }

  message Unasked {
    string worktree = 1;
    string why = 2;
  }
}

message PruneRequest {
  On on = 1;
  string dir = 2;
  repeated Deleting agreed = 3;

  message Deleting {
    string worktree = 1;
    string branch = 2;
    string head = 3;
    uint32 number = 4;
    PrunesResponse.RemoteBranch remote = 5;
  }
}

message PruneResponse {
  oneof answer {
    PrunesResponse changed = 1;
    Outcomes deleted = 2;
  }

  message Outcomes {
    repeated Outcome outcomes = 1;
  }

  message Outcome {
    string worktree = 1;
    oneof came {
      google.protobuf.Empty gone = 2;
      string went_but = 3;
      string stays = 4;
    }
  }
}

message FileIssueRequest {
  On on = 1;
  string dir = 2;
  string words = 3;
  string repository = 4;
}

message FileIssueResponse {
  string url = 1;
  string title = 2;
}

message IssueRepositoriesRequest {
  On on = 1;
  string dir = 2;
}

message IssueRepositoriesResponse {
  repeated IssueRepository repositories = 1;
}

message IssueRepository {
  string remote = 1;
  string repository = 2;
}

message Projects {
  oneof held {
    Kept kept = 1;
    string unkept = 2;
  }

  message Kept {
    repeated Project projects = 1;
    Version version = 2;
  }
}

message Project {
  fixed64 id = 1;
  string name = 2;
  string dir = 3;
  bool missing = 4;
  repeated Workstream workstreams = 5;
}

message Workstream {
  fixed64 id = 1;
  string name = 2;
  bool renamed = 3;
  string folder = 4;
  oneof seen {
    google.protobuf.Empty missing = 5;
    Stage stage = 6;
    google.protobuf.Empty unread = 7;
  }
  repeated Terminal terminals = 8;
  google.protobuf.Timestamp used_at = 9;
}

message Terminal {
  fixed64 id = 1;
  oneof found {
    TerminalKey key = 2;
    google.protobuf.Empty lost = 3;
    google.protobuf.Empty looking = 4;
  }
  string folder = 5;
  optional string command = 6;
  Titled titled = 7;
  Shell shell = 8;
  bool held = 9;
  optional string name = 10;
}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_NO_BRANCH = 1;
  STAGE_WORKING = 2;
  STAGE_PULL_REQUEST_OPEN = 3;
  STAGE_CHECKS_FAILING = 4;
  STAGE_MERGED = 5;
}

message ChangeProjectsRequest {
  On on = 1;
  oneof change {
    AddProject add_project = 2;
    AddWorkstream add_workstream = 3;
    RenameProject rename_project = 4;
    RenameWorkstream rename_workstream = 5;
    ForgetProject forget_project = 8;
    ForgetWorkstream forget_workstream = 9;
    WorkstreamAt workstream_at = 10;
    RenameTerminal rename_terminal = 11;
    CloseWorkstream close_workstream = 12;
    ReorderProjects reorder_projects = 15;
    ReorderWorkstreams reorder_workstreams = 16;
  }

  reserved 6, 7, 13, 14;
  reserved "move_project", "move_workstream";

  message AddProject {
    string dir = 1;
    optional string name = 2;
  }

  message AddWorkstream {
    fixed64 project = 1;
    string folder = 2;
    optional string name = 3;
  }

  message RenameProject {
    fixed64 project = 1;
    string to = 2;
  }

  message RenameWorkstream {
    fixed64 workstream = 1;
    optional string to = 2;
  }

  message ForgetProject {
    fixed64 project = 1;
  }

  message ForgetWorkstream {
    fixed64 workstream = 1;
  }

  message WorkstreamAt {
    fixed64 project = 1;
    string folder = 2;
  }

  message RenameTerminal {
    fixed64 terminal = 1;
    optional string to = 2;
  }

  message CloseWorkstream {
    fixed64 workstream = 1;
  }

  message ReorderProjects {
    repeated fixed64 projects = 1;
    repeated fixed64 seen = 2;
  }

  message ReorderWorkstreams {
    fixed64 project = 1;
    repeated fixed64 workstreams = 2;
    repeated fixed64 seen = 3;
  }
}

message ChangeProjectsResponse {
  optional fixed64 made = 1;
  Version kept = 2;
}

message ShowRequest {
  oneof event {
    Hello hello = 1;
    Size size = 2;
    fixed64 go = 3;
    Open open = 4;
    google.protobuf.Empty close = 5;
    Focus focus = 6;
    Resize resize = 7;
    Move move = 8;
    google.protobuf.Empty fullscreen = 9;
  }

  message Hello {
    fixed64 workstream = 1;
    Size size = 2;
    TerminalKey runs_in = 3;
    bool again = 4;
    On on = 5;
  }

  message Size {
    uint32 columns = 1;
    uint32 rows = 2;
  }

  message Open {
    oneof beside {
      google.protobuf.Empty largest = 1;
      Towards towards = 2;
      google.protobuf.Empty focused = 4;
      google.protobuf.Empty alone = 5;
    }
    repeated string argv = 3;
  }

  message Focus {
    oneof to {
      Direction direction = 1;
      Order order = 2;
      fixed64 terminal = 3;
    }
  }

  message Resize {
    reserved 2;
    reserved "grow";
    oneof sides {
      Direction direction = 1;
      google.protobuf.Empty every = 3;
    }
    Growth growth = 4;
  }

  message Move {
    oneof to {
      Direction direction = 1;
      Order order = 2;
    }
  }

  enum Towards {
    TOWARDS_UNSPECIFIED = 0;
    TOWARDS_RIGHT = 1;
    TOWARDS_DOWN = 2;
  }

  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_LEFT = 1;
    DIRECTION_RIGHT = 2;
    DIRECTION_UP = 3;
    DIRECTION_DOWN = 4;
  }

  enum Order {
    ORDER_UNSPECIFIED = 0;
    ORDER_NEXT = 1;
    ORDER_PREVIOUS = 2;
  }

  enum Growth {
    GROWTH_UNSPECIFIED = 0;
    GROWTH_GROW = 1;
    GROWTH_SHRINK = 2;
  }
}

message ViewRequest {
  oneof event {
    Hello hello = 1;
    luneta.mux.v1.FromViewer said = 2;
  }

  message Hello {
    On on = 1;
    luneta.mux.v1.Greeting greeting = 2;
  }
}

message ShowResponse {
  oneof event {
    Laid laid = 1;
    string refused = 2;
    Edged edged = 3;
  }

  message Edged {
    fixed64 workstream = 1;
    ShowRequest.Direction direction = 2;
  }

  message Laid {
    reserved 4, 5;
    fixed64 workstream = 1;
    ShowRequest.Size size = 2;
    repeated Pane panes = 3;
    oneof shown {
      fixed64 tiled = 6;
      fixed64 full = 7;
    }
  }

  message Pane {
    fixed64 terminal = 1;
    Rect rect = 2;
    oneof found {
      TerminalKey key = 3;
      google.protobuf.Empty lost = 4;
      google.protobuf.Empty looking = 5;
    }
  }

  message Rect {
    uint32 column = 1;
    uint32 row = 2;
    uint32 columns = 3;
    uint32 rows = 4;
  }
}

message TerminalKey {
  uint32 id = 1;
  google.protobuf.Timestamp made_at = 2;
}
