// What lunetad, the daemon of a host, answers. It listens on a Unix socket,
// `lunetad.sock` in luneta's runtime folder (see `crates/lunetad/src/folder.rs`),
// and on nothing else.
//
// A field is never renumbered or given another type. One that goes away leaves
// its number `reserved`, so that a client built against an older version reads
// a newer daemon's answer as it was meant.
syntax = "proto3";

package luneta.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service Daemon {
  // Which daemon runs, and since when.
  rpc Info(InfoRequest) returns (InfoResponse);
  // The agents that run on the host, each as it stands now.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // The host as it stands: its zellij sessions, their panes and clients, what
  // the shell in each pane says through luneta's hook, how the work trees
  // those panes are in stand, the pull requests of the branches checked out
  // there, and its agents. It answers at once when the
  // host is no longer as the client last saw it, and otherwise as soon as the
  // host changes, or after four seconds with the host as it was.
  rpc Watch(WatchRequest) returns (Host);
}

message WatchRequest {
  // The host as the client last saw it. Absent for a first look.
  Version after = 1;
}

// A state of the host, as one daemon counts them.
message Version {
  // The daemon's process id. The next daemon counts from 0 again.
  uint32 pid = 1;
  // Goes up by one each time the host changes.
  uint64 seq = 2;
}

message Host {
  // Always there: a client that finds none has an answer that does not read.
  Version version = 1;
  // The sessions that run, in no order a client can count on.
  repeated Session sessions = 2;
  // How the work tree stands in each directory a pane works in, once git has
  // said. In no order a client can count on.
  repeated WorkTree work_trees = 3;
  // The agents and the session files that do not read, as
  // `ListAgentsResponse` has them.
  repeated Agent agents = 4;
  uint32 unread = 5;
  // The pull request of the branch checked out in each directory a pane works
  // in, once gh has found one. In no order a client can count on.
  repeated PullRequest pull_requests = 6;
  // The folders and sockets of zellij's the daemon could not read as it last
  // looked, any of which could be a session's: while there are any,
  // `sessions` may leave out one that runs. Absent from a daemon older than
  // this field, which could not say, and whose `sessions` may leave one out
  // too.
  optional uint32 unread_sockets = 7;
}

// A zellij session that runs: its server listens on a socket named for it.
message Session {
  string name = 1;
  // When its server started: when it made its socket, which a rename keeps.
  // Always there.
  google.protobuf.Timestamp started_at = 2;
  // Its panes, as zellij last listed them. Absent until zellij has, and while
  // another session runs under its name: zellij is asked for them by name, and
  // answers for one of the two, which the daemon cannot tell.
  Panes panes = 3;
  // Its clients, as zellij last listed them. Absent as `panes` is.
  Clients clients = 4;
  // The inode of its socket, which a rename keeps too. With `started_at` it
  // tells every session from every other: two servers can make their sockets
  // in one tick of the clock that dates them, and a socket made later can
  // take the inode of one gone, but not both. Never 0.
  uint64 socket = 5;
}

message Panes {
  // Its terminals. A plugin's pane is left out, and so is a pane zellij keeps
  // off the screen, as one that another took the place of.
  repeated Pane panes = 1;
}

message Clients {
  // Those attached to it, by their ids. One that left is not among them.
  repeated Client clients = 1;
}

// A client attached to a session, as `zellij action list-clients` lists it.
// zellij does not say whose it is.
message Client {
  // Its id, which zellij gives it as it comes to the session: the lowest that
  // nothing connected to the session holds, where a `zellij action` holds one
  // too while it runs. It keeps it for as long as it stays, no other client
  // gets it meanwhile, and it gets another in each session it goes to.
  uint32 id = 1;
  // The pane it has the focus on, in the tab it is on, by the id of one of
  // its session's `Panes`, unless zellij keeps that one off the screen.
  // Absent while the focus is on a plugin's pane.
  optional uint32 pane = 2;
}

// A terminal, as `zellij action list-panes` lists it.
message Pane {
  // Its id, which is unique within its session and not across them.
  uint32 id = 1;
  // The tab it is in: its position, from 0, and its name.
  uint32 tab = 2;
  string tab_name = 3;
  // Where it works, absent until zellij has said. What it said last stands
  // while it is too busy to say.
  optional string cwd = 4;
  // What runs in front in it: the command line of the process in the
  // foreground, or of the shell itself at its prompt. Absent, and kept, as
  // `cwd` is.
  optional string command = 5;
  // What an agent says in its title, where the glyph an agent leads a title
  // with leads it: Claude Code's `✳`, or the frame it turns in the place of the
  // `✳` while it works, which would change the host all the time. Absent for a
  // title that leads with no such glyph, as a shell's, or zellij's own
  // `Pane #1`: it is the glyph that tells an agent's. zellij keeps the last
  // title a program gave, so an agent's can outlast it.
  Titled titled = 6;
  // What its shell says through luneta's hook. Absent for a shell without the
  // hook, and for one that has said nothing yet.
  Shell shell = 7;
}

// What an agent says in the title of its pane, without the glyph.
message Titled {
  // Its topic: `Fix the fold` for `✳ Fix the fold`, and for the frame turned
  // in the place of the `✳`. Absent for the bare `Claude Code` Claude Code
  // titles its pane with until it has a topic, which some never get.
  optional string topic = 1;
}

// What a shell with luneta's hook said last: the command it runs, or the one it
// ran last and how that ended. The hook counts whole seconds, so each time
// here is the second it said.
message Shell {
  // One of these, always: a client that finds none has a newer daemon's.
  oneof doing {
    Going going = 1;
    Ended ended = 2;
    Stopped stopped = 3;
  }

  // A command it runs.
  message Going {
    // The command line, on one line.
    string command = 1;
    // When it started. Always there.
    google.protobuf.Timestamp since = 2;
    // What the command in front of its terminal does. Never unspecified.
    Front front = 3;
  }

  // The command it ran last, which ended.
  message Ended {
    string command = 1;
    // When it ended. Always there.
    google.protobuf.Timestamp at = 2;
    // Its exit status. Absent where the shell cannot say it, as fish cannot
    // after `fg`.
    optional int32 status = 3;
    // How long it ran, to the millisecond. Always there.
    google.protobuf.Duration took = 4;
  }

  // A job it stopped, with `Ctrl z`, which waits to be brought back.
  message Stopped {
    string command = 1;
    // When it stopped. Always there.
    google.protobuf.Timestamp at = 2;
  }
}

// What the command in front of a terminal does, by how the terminal takes keys
// and whether a process in front of it reads it.
enum Front {
  // Never sent. A client that finds it, or a number it does not know, has the
  // word of a newer daemon's.
  FRONT_UNSPECIFIED = 0;
  // It works, and reads nothing from the terminal.
  FRONT_WORKING = 1;
  // It waits for you to type: it reads the terminal a line at a time, or with
  // the echo off, as a password prompt does. A blocking read of a socket looks
  // the same to Linux, and is this too.
  FRONT_ASKING = 2;
  // It takes the terminal over a key at a time, as an editor, a pager or `ssh`
  // does, for as long as you use it.
  FRONT_INTERACTIVE = 3;
}

// How the work tree stands where a pane works, as `git status` says it.
message WorkTree {
  // The directory, as zellij spells the pane's.
  string dir = 1;
  // One of these, always: a client that finds neither has a newer daemon's.
  oneof stands {
    // git failed there: the directory is in no repository, or in one git
    // cannot read.
    Outside outside = 2;
    Checkout checkout = 3;
  }

  message Outside {}
}

// A repository's work tree: what is checked out there, and what changed.
message Checkout {
  // One of these, always.
  oneof head {
    Detached detached = 1;
    Branch branch = 2;
  }
  // How many paths there are of each kind of change. Always there.
  Changes changes = 3;
  uint32 stashes = 4;

  // `HEAD` names a commit, and no branch.
  message Detached {}
}

message Branch {
  string name = 1;
  // How far it is from its upstream. Absent when it has none.
  Upstream upstream = 2;
}

message Changes {
  uint32 conflicted = 1;
  // In the index or in the work tree.
  uint32 deleted = 2;
  uint32 renamed = 3;
  // In the work tree, a path added with `--intent-to-add` among them, and one
  // whose type changed.
  uint32 modified = 4;
  // In the index.
  uint32 staged = 5;
  uint32 untracked = 6;
}

message Upstream {
  uint32 ahead = 1;
  uint32 behind = 2;
}

// The pull request on GitHub of the branch checked out where a pane works, as
// `gh pr view` finds it there: an open one before the rest. gh is asked again
// about each branch every minute, and about one a pane has just come to at
// once.
message PullRequest {
  // The directory, as `WorkTree` has it: the pull request is of the branch
  // its work tree has checked out.
  string dir = 1;
  // Never 0: GitHub counts them from 1.
  uint32 number = 2;
  // Never unspecified.
  PullRequestState state = 3;
}

enum PullRequestState {
  // Never sent. A client that finds it, or a number it does not know, has the
  // state of a newer daemon's.
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_STATE_OPEN = 1;
  // Open, and a draft.
  PULL_REQUEST_STATE_DRAFT = 2;
  PULL_REQUEST_STATE_MERGED = 3;
  // Closed, and not merged.
  PULL_REQUEST_STATE_CLOSED = 4;
}

message InfoRequest {}

message InfoResponse {
  // The version of luneta the daemon was built from.
  string version = 1;
  // Its process id, by which a client tells one daemon from the next across a
  // restart.
  uint32 pid = 2;
  // When it started.
  google.protobuf.Timestamp started_at = 3;
  // The folder it reads zellij's sessions in, as its environment named it
  // when it started, in the bytes of its path, which need not be UTF-8. Its
  // `Host.sessions` are those of this folder alone. Absent from a daemon
  // older than this field, which could not say.
  optional bytes zellij_folder = 4;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  // In no order a client can count on.
  repeated Agent agents = 1;
  // Claude Code's session files that the daemon cannot read, and so lists no
  // agent for: cut short for good, or in a shape of a newer Claude Code's. The
  // daemon's log says which.
  uint32 unread = 2;
}

// A Claude Code agent: the one process of it that runs, and its session.
message Agent {
  uint32 pid = 1;
  // Claude Code's id for the session, which names its transcript. Never
  // empty: the daemon reads a session file that names none as no agent's.
  string session_id = 2;
  // Where it works. Never empty, as `session_id` is not.
  string cwd = 3;
  // What it is doing, as Claude Code says. Neither when it says nothing.
  oneof status {
    // A status the daemon knows.
    Status known_status = 4;
    // A word it does not, as Claude Code wrote it: a newer Claude Code's.
    string other_status = 10;
  }
  // When it came to its status, as Claude Code dates it. Absent where it
  // does not: when it last wrote the session file, or when the session
  // started, is no date of the status.
  google.protobuf.Timestamp status_since = 5;
  // When its session started.
  google.protobuf.Timestamp started_at = 6;
  // The name Claude Code gives the session, if any.
  Name name = 7;
  // How Claude Code says it was started, verbatim: `cli` for the agent a person
  // talks to at a prompt, `sdk-cli` for a `claude -p`, and a word of its own
  // for each of the many other ways, which it adds to. Absent when it does not
  // say.
  optional string entrypoint = 8;
  // Where it runs in zellij, absent when it runs outside zellij.
  Zellij zellij = 9;
}

enum Status {
  // Never sent. A client that finds it, or a number it does not know, has the
  // status of a newer daemon's.
  STATUS_UNSPECIFIED = 0;
  // At work: the one status that ends on its own.
  STATUS_BUSY = 1;
  // Done, and waiting for the next prompt.
  STATUS_IDLE = 2;
  // It asked something, and waits for the answer.
  STATUS_WAITING = 3;
  // It is a shell.
  STATUS_SHELL = 4;
}

message Name {
  string text = 1;
  // Who chose it. Absent when Claude Code does not say, as one from before it
  // said did not.
  optional NameSource source = 2;
}

// Who chose a name, as Claude Code spells it: `user`, `peer`, `derived`,
// `collision`, `auto` or `hook`, the words it reads back itself.
enum NameSource {
  // Never sent.
  NAME_SOURCE_UNSPECIFIED = 0;
  // `user` and `peer` are a name someone gave.
  NAME_SOURCE_USER = 1;
  NAME_SOURCE_PEER = 2;
  // `derived` is Claude Code's own, from the directory.
  NAME_SOURCE_DERIVED = 3;
  NAME_SOURCE_COLLISION = 4;
  NAME_SOURCE_AUTO = 5;
  NAME_SOURCE_HOOK = 6;
  // A word the daemon does not know: a newer Claude Code's.
  NAME_SOURCE_OTHER = 7;
}

// The pane an agent runs in.
message Zellij {
  // The session its environment names: what the session was called when the
  // pane opened. A rename leaves it behind.
  string named = 1;
  // The session it runs in now, under the name it has now. Absent when the
  // daemon cannot tell: the session it names is gone, or was renamed before
  // the daemon started, or more than one session that could be it has held
  // the name.
  optional string session = 2;
  // The pane's id, which is unique within its session and not across them.
  uint32 pane = 3;
}
