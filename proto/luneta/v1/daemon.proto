// What lunetad, the daemon of a host, answers. It listens on a Unix socket,
// `lunetad.sock` in luneta's runtime folder (see `crates/lunetad/src/folder.rs`),
// and on nothing else.
//
// A field is never renumbered or given another type. One that goes away leaves
// its number `reserved`, so that a client built against an older version reads
// a newer daemon's answer as it was meant.
syntax = "proto3";

package luneta.v1;

import "google/protobuf/timestamp.proto";

service Daemon {
  // Which daemon runs, and since when.
  rpc Info(InfoRequest) returns (InfoResponse);
  // The agents that run on the host, each as it stands now.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // The host as it stands: its zellij sessions and their panes, how the work
  // trees those panes are in stand, and its agents. It answers at once when
  // the host is no longer as the client last saw it, and otherwise as soon as
  // the host changes, or after four seconds with the host as it was.
  rpc Watch(WatchRequest) returns (Host);
}

message WatchRequest {
  // The host as the client last saw it. Absent for a first look.
  Version after = 1;
}

// A state of the host, as one daemon counts them.
message Version {
  // The daemon's process id. The next daemon counts from 0 again.
  uint32 pid = 1;
  // Goes up by one each time the host changes.
  uint64 seq = 2;
}

message Host {
  // Always there: a client that finds none has an answer that does not read.
  Version version = 1;
  // The sessions that run, in no order a client can count on.
  repeated Session sessions = 2;
  // How the work tree stands in each directory a pane works in, once git has
  // said. In no order a client can count on.
  repeated WorkTree work_trees = 3;
  // The agents and the session files that do not read, as
  // `ListAgentsResponse` has them.
  repeated Agent agents = 4;
  uint32 unread = 5;
}

// A zellij session that runs: its server listens on a socket named for it.
message Session {
  string name = 1;
  // When its server started.
  google.protobuf.Timestamp started_at = 2;
  // Its panes, as zellij last listed them. Absent until zellij has, and while
  // another session runs under its name: zellij is asked for them by name, and
  // answers for one of the two, which the daemon cannot tell.
  Panes panes = 3;
}

message Panes {
  // Its terminals. A plugin's pane is left out, and so is a pane zellij keeps
  // off the screen, as one that another took the place of.
  repeated Pane panes = 1;
}

// A terminal, as `zellij action list-panes` lists it. Its title is zellij's
// to tell: Claude Code turns a frame in it while it works, which would change
// the host all the time.
message Pane {
  // Its id, which is unique within its session and not across them.
  uint32 id = 1;
  // The tab it is in: its position, from 0, and its name.
  uint32 tab = 2;
  string tab_name = 3;
  // Where it works, absent until zellij has said. What it said last stands
  // while it is too busy to say.
  optional string cwd = 4;
  // What runs in front in it: the command line of the process in the
  // foreground, or of the shell itself at its prompt. Absent, and kept, as
  // `cwd` is.
  optional string command = 5;
}

// How the work tree stands where a pane works, as `git status` says it.
message WorkTree {
  // The directory, as zellij spells the pane's.
  string dir = 1;
  // One of these, always: a client that finds neither has a newer daemon's.
  oneof stands {
    // git failed there: the directory is in no repository, or in one git
    // cannot read.
    Outside outside = 2;
    Checkout checkout = 3;
  }

  message Outside {}
}

// A repository's work tree: what is checked out there, and what changed.
message Checkout {
  // One of these, always.
  oneof head {
    Detached detached = 1;
    Branch branch = 2;
  }
  // How many paths there are of each kind of change. Always there.
  Changes changes = 3;
  uint32 stashes = 4;

  // `HEAD` names a commit, and no branch.
  message Detached {}
}

message Branch {
  string name = 1;
  // How far it is from its upstream. Absent when it has none.
  Upstream upstream = 2;
}

message Changes {
  uint32 conflicted = 1;
  // In the index or in the work tree.
  uint32 deleted = 2;
  uint32 renamed = 3;
  // In the work tree, a path added with `--intent-to-add` among them.
  uint32 modified = 4;
  // In the index.
  uint32 staged = 5;
  uint32 untracked = 6;
}

message Upstream {
  uint32 ahead = 1;
  uint32 behind = 2;
}

message InfoRequest {}

message InfoResponse {
  // The version of luneta the daemon was built from.
  string version = 1;
  // Its process id, by which a client tells one daemon from the next across a
  // restart.
  uint32 pid = 2;
  // When it started.
  google.protobuf.Timestamp started_at = 3;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  // In no order a client can count on.
  repeated Agent agents = 1;
  // Claude Code's session files that the daemon cannot read, and so lists no
  // agent for: cut short for good, or in a shape of a newer Claude Code's. The
  // daemon's log says which.
  uint32 unread = 2;
}

// A Claude Code agent: the one process of it that runs, and its session.
message Agent {
  uint32 pid = 1;
  // Claude Code's id for the session, which names its transcript.
  string session_id = 2;
  // Where it works.
  string cwd = 3;
  // What it is doing, as Claude Code says. Neither when it says nothing.
  oneof status {
    // A status the daemon knows.
    Status known_status = 4;
    // A word it does not, as Claude Code wrote it: a newer Claude Code's.
    string other_status = 10;
  }
  // When it came to its status, as Claude Code dates it.
  google.protobuf.Timestamp status_since = 5;
  // When its session started.
  google.protobuf.Timestamp started_at = 6;
  // The name Claude Code gives the session, if any.
  Name name = 7;
  // How Claude Code says it was started, verbatim: `cli` for the agent a person
  // talks to at a prompt, `sdk-cli` for a `claude -p`, and a word of its own
  // for each of the many other ways, which it adds to. Absent when it does not
  // say.
  optional string entrypoint = 8;
  // Where it runs in zellij, absent when it runs outside zellij.
  Zellij zellij = 9;
}

enum Status {
  // Never sent. A client that finds it, or a number it does not know, has the
  // status of a newer daemon's.
  STATUS_UNSPECIFIED = 0;
  // At work: the one status that ends on its own.
  STATUS_BUSY = 1;
  // Done, and waiting for the next prompt.
  STATUS_IDLE = 2;
  // It asked something, and waits for the answer.
  STATUS_WAITING = 3;
  // It is a shell.
  STATUS_SHELL = 4;
}

message Name {
  string text = 1;
  // Who chose it. Absent when Claude Code does not say, as one from before it
  // said did not.
  optional NameSource source = 2;
}

// Who chose a name, as Claude Code spells it: `user`, `peer`, `derived`,
// `collision`, `auto` or `hook`, the words it reads back itself.
enum NameSource {
  // Never sent.
  NAME_SOURCE_UNSPECIFIED = 0;
  // `user` and `peer` are a name someone gave.
  NAME_SOURCE_USER = 1;
  NAME_SOURCE_PEER = 2;
  // `derived` is Claude Code's own, from the directory.
  NAME_SOURCE_DERIVED = 3;
  NAME_SOURCE_COLLISION = 4;
  NAME_SOURCE_AUTO = 5;
  NAME_SOURCE_HOOK = 6;
  // A word the daemon does not know: a newer Claude Code's.
  NAME_SOURCE_OTHER = 7;
}

// The pane an agent runs in.
message Zellij {
  // The session its environment names: what the session was called when the
  // pane opened. A rename leaves it behind.
  string named = 1;
  // The session it runs in now, under the name it has now. Absent when the
  // daemon cannot tell: the session it names is gone, or was renamed before
  // the daemon started, or more than one session that could be it has held
  // the name.
  optional string session = 2;
  // The pane's id, which is unique within its session and not across them.
  uint32 pane = 3;
}
