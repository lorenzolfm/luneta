syntax = "proto3";

package luneta.mux.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service Mux {
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse);
  rpc NewTab(NewTabRequest) returns (NewTabResponse);
  rpc CloseTab(CloseTabRequest) returns (CloseTabResponse);
  rpc Kill(KillRequest) returns (KillResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc Go(GoRequest) returns (GoResponse);
  rpc Dump(DumpRequest) returns (DumpResponse);
  rpc List(ListRequest) returns (Listing);
  rpc Watch(WatchRequest) returns (stream Listing);
  rpc Attach(stream ToServer) returns (stream ToClient);
  rpc NewPane(NewPaneRequest) returns (NewPaneResponse);
  rpc ClosePane(ClosePaneRequest) returns (ClosePaneResponse);
  rpc Turn(TurnRequest) returns (TurnResponse);
}

message NewSessionRequest {
  string name = 1;
  Opens opens = 2;
}

message NewSessionResponse {
  uint64 session = 1;
  uint32 tab = 2;
  uint32 pane = 3;
  google.protobuf.Timestamp made_at = 4;
}

message NewTabRequest {
  uint64 session = 1;
  optional string name = 2;
  Opens opens = 3;
}

message NewTabResponse {
  uint32 tab = 1;
  uint32 pane = 2;
}

message Opens {
  string cwd = 1;
  oneof runs {
    Shell shell = 2;
    Program program = 3;
  }
  Ends ends = 4;
}

message Shell {}

message Program {
  repeated string argv = 1;
}

enum Ends {
  ENDS_UNSPECIFIED = 0;
  ENDS_CLOSES = 1;
  ENDS_HOLDS = 2;
}

message NewPaneRequest {
  oneof at {
    Beside beside = 1;
    uint32 tab = 2;
  }
  Opens opens = 3;
}

message Beside {
  uint32 pane = 1;
  Towards towards = 2;
}

enum Towards {
  TOWARDS_UNSPECIFIED = 0;
  TOWARDS_RIGHT = 1;
  TOWARDS_DOWN = 2;
}

message NewPaneResponse {
  uint32 pane = 1;
}

message ClosePaneRequest {
  uint32 pane = 1;
}

message ClosePaneResponse {}

message TurnRequest {
  uint32 pane = 1;
  Into into = 2;
}

message Into {
  oneof is {
    NewTab new_tab = 1;
    uint32 tab = 2;
  }
}

message NewTab {
  optional string name = 1;
}

message TurnResponse {
  uint32 tab = 1;
}

message CloseTabRequest {
  uint32 tab = 1;
}

message CloseTabResponse {}

message KillRequest {
  uint64 session = 1;
}

message KillResponse {}

message RenameRequest {
  uint64 session = 1;
  string name = 2;
}

message RenameResponse {}

message GoRequest {
  oneof who {
    uint64 client = 1;
    uint64 last_typed_in = 2;
  }
  Place to = 3;
}

message GoResponse {
  uint64 client = 1;
}

message Place {
  oneof is {
    uint64 session = 1;
    uint32 tab = 2;
    uint32 pane = 4;
  }
  google.protobuf.Timestamp made_at = 3;
}

message DumpRequest {
  uint32 pane = 1;
  Dumped dumped = 2;
}

enum Dumped {
  DUMPED_UNSPECIFIED = 0;
  DUMPED_SCREEN = 1;
  DUMPED_TEXT = 2;
}

message DumpResponse {
  string text = 1;
}

message ListRequest {}

message WatchRequest {}

message Listing {
  repeated Session sessions = 1;
}

message Session {
  uint64 id = 1;
  string name = 2;
  repeated Tab tabs = 3;
  uint32 current_tab = 4;
  google.protobuf.Timestamp made_at = 5;
}

message Tab {
  uint32 id = 1;
  string name = 2;
  repeated Pane panes = 3;
}

message Pane {
  uint32 id = 1;
  string title = 2;
  string cwd = 3;
  oneof program {
    uint32 pid = 4;
    Exit ended = 5;
  }
  repeated Client clients = 6;
  Foreground foreground = 7;
  Ran ran = 8;
  optional string name = 9;
}

message Foreground {
  uint32 pid = 1;
  repeated string argv = 2;
}

message Ran {
  oneof is {
    Ready ready = 1;
    Going going = 2;
    Ended ended = 3;
    Stopped stopped = 4;
  }

  message Ready {}

  message Going {
    optional string command = 1;
    google.protobuf.Timestamp since = 2;
    Front front = 3;
  }

  message Ended {
    optional string command = 1;
    google.protobuf.Timestamp at = 2;
    oneof ending {
      int32 status = 3;
      Resumed resumed = 4;
    }
    google.protobuf.Duration took = 5;
  }

  message Resumed {}

  message Stopped {
    optional string command = 1;
    google.protobuf.Timestamp at = 2;
  }
}

enum Front {
  FRONT_UNSPECIFIED = 0;
  FRONT_WORKING = 1;
  FRONT_ASKING = 2;
  FRONT_INTERACTIVE = 3;
}

message Exit {
  oneof how {
    int32 code = 1;
    int32 signal = 2;
  }
}

message Client {
  uint64 id = 1;
  Size size = 2;
}

message Size {
  uint32 columns = 1;
  uint32 rows = 2;
}

message ToServer {
  oneof event {
    Hello hello = 1;
    Key key = 2;
    Mouse mouse = 3;
    Paste paste = 4;
    Focus focus = 5;
    Size resize = 6;
    Scroll scroll = 7;
    Place go = 8;
    Open open = 9;
    ClosePane close_pane = 10;
    FocusPane focus_pane = 11;
    ResizePane resize_pane = 12;
    MovePane move_pane = 13;
    Fullscreen fullscreen = 14;
    NamePane name_pane = 15;
    NameTab name_tab = 16;
    MoveTab move_tab = 17;
    Into turn = 18;
  }
}

message Open {
  oneof at {
    Largest largest = 1;
    Towards beside = 2;
  }
}

message Largest {}

message ClosePane {}

message FocusPane {
  oneof to {
    Direction towards = 1;
    Direction towards_or_tab = 2;
    Order order = 3;
  }
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_LEFT = 1;
  DIRECTION_RIGHT = 2;
  DIRECTION_UP = 3;
  DIRECTION_DOWN = 4;
}

enum Order {
  ORDER_UNSPECIFIED = 0;
  ORDER_NEXT = 1;
  ORDER_PREVIOUS = 2;
}

message ResizePane {
  Change change = 1;
  optional Direction towards = 2;
}

enum Change {
  CHANGE_UNSPECIFIED = 0;
  CHANGE_GROW = 1;
  CHANGE_SHRINK = 2;
}

message MovePane {
  oneof to {
    Direction towards = 1;
    Order order = 2;
  }
}

message Fullscreen {}

message NamePane {
  optional string name = 1;
}

message NameTab {
  string name = 1;
}

message MoveTab {
  Direction towards = 1;
}

message Hello {
  Place to = 1;
  Size size = 2;
  Colours colours = 3;
}

message Colours {
  Rgb foreground = 1;
  Rgb background = 2;
}

message Rgb {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
}

message Key {
  Press press = 1;
  Modifiers modifiers = 2;
  oneof key {
    Named named = 3;
    uint32 character = 4;
  }
  string text = 5;
}

enum Press {
  PRESS_UNSPECIFIED = 0;
  PRESS_DOWN = 1;
  PRESS_REPEAT = 2;
  PRESS_UP = 3;
}

message Modifiers {
  bool shift = 1;
  bool alt = 2;
  bool ctrl = 3;
  bool super_key = 4;
}

enum Named {
  NAMED_UNSPECIFIED = 0;
  NAMED_ENTER = 1;
  NAMED_TAB = 2;
  NAMED_BACKSPACE = 3;
  NAMED_ESCAPE = 4;
  NAMED_INSERT = 5;
  NAMED_DELETE = 6;
  NAMED_HOME = 7;
  NAMED_END = 8;
  NAMED_PAGE_UP = 9;
  NAMED_PAGE_DOWN = 10;
  NAMED_UP = 11;
  NAMED_DOWN = 12;
  NAMED_LEFT = 13;
  NAMED_RIGHT = 14;
  NAMED_F1 = 15;
  NAMED_F2 = 16;
  NAMED_F3 = 17;
  NAMED_F4 = 18;
  NAMED_F5 = 19;
  NAMED_F6 = 20;
  NAMED_F7 = 21;
  NAMED_F8 = 22;
  NAMED_F9 = 23;
  NAMED_F10 = 24;
  NAMED_F11 = 25;
  NAMED_F12 = 26;
  NAMED_CAPS_LOCK = 27;
  NAMED_NUM_LOCK = 28;
  NAMED_SCROLL_LOCK = 29;
  NAMED_PRINT_SCREEN = 30;
  NAMED_PAUSE = 31;
  NAMED_MENU = 32;
  NAMED_SHIFT_LEFT = 33;
  NAMED_SHIFT_RIGHT = 34;
  NAMED_CTRL_LEFT = 35;
  NAMED_CTRL_RIGHT = 36;
  NAMED_ALT_LEFT = 37;
  NAMED_ALT_RIGHT = 38;
  NAMED_SUPER_LEFT = 39;
  NAMED_SUPER_RIGHT = 40;
}

message Mouse {
  Modifiers modifiers = 1;
  uint32 column = 2;
  uint32 row = 3;
  oneof does {
    Button press = 4;
    Button release = 5;
    Motion motion = 6;
    Wheel wheel = 7;
  }
}

enum Button {
  BUTTON_UNSPECIFIED = 0;
  BUTTON_LEFT = 1;
  BUTTON_MIDDLE = 2;
  BUTTON_RIGHT = 3;
}

message Motion {
  optional Button held = 1;
}

enum Wheel {
  WHEEL_UNSPECIFIED = 0;
  WHEEL_UP = 1;
  WHEEL_DOWN = 2;
  WHEEL_LEFT = 3;
  WHEEL_RIGHT = 4;
}

message Paste {
  string text = 1;
}

message Focus {
  bool focused = 1;
}

message Scroll {
  sint32 back = 1;
}

message ToClient {
  oneof event {
    Attached attached = 1;
    Went went = 2;
    Frame frame = 3;
    Ended ended = 4;
    Stayed stayed = 5;
    Layout layout = 6;
    Refused refused = 7;
  }
}

message Layout {
  uint64 session = 1;
  uint32 tab = 2;
  Size size = 3;
  repeated Placed panes = 4;
  uint32 focused = 5;
  bool fullscreen = 6;
  repeated Tabbed tabs = 7;
}

message Placed {
  uint32 pane = 1;
  Rect rect = 2;
  string title = 3;
}

message Rect {
  uint32 column = 1;
  uint32 row = 2;
  uint32 columns = 3;
  uint32 rows = 4;
}

message Tabbed {
  uint32 id = 1;
  string name = 2;
}

message Refused {
  string reason = 1;
}

message Attached {
  uint64 client = 1;
}

message Went {
  uint64 session = 1;
  uint32 tab = 2;
  uint32 pane = 3;
}

message Ended {}

message Stayed {
  string reason = 1;
}

message Frame {
  uint32 pane = 1;
  Size size = 2;
  oneof rows {
    Whole whole = 3;
    Changed changed = 4;
  }
  Cursor cursor = 5;
  bool clusters = 6;
  bool mouse_tracking = 7;
  uint32 scrolled_back = 8;
  uint32 scrollback = 9;
}

message Whole {
  repeated Line lines = 1;
}

message Changed {
  repeated Row rows = 1;
}

message Row {
  uint32 index = 1;
  Line line = 2;
}

message Line {
  repeated Glyph glyphs = 1;
  bool wraps_wide = 2;
}

message Glyph {
  oneof shows {
    Blank blank = 1;
    Narrow narrow = 2;
    Wide wide = 3;
  }
  Style style = 4;
}

message Blank {}

message Narrow {
  string grapheme = 1;
}

message Wide {
  string grapheme = 1;
}

message Style {
  Colour foreground = 1;
  Colour background = 2;
  Colour underline_colour = 3;
  bool bold = 4;
  bool italic = 5;
  bool faint = 6;
  bool blink = 7;
  bool inverse = 8;
  bool invisible = 9;
  bool strikethrough = 10;
  bool overline = 11;
  Underline underline = 12;
}

message Colour {
  oneof is {
    uint32 palette = 1;
    Rgb rgb = 2;
  }
}

enum Underline {
  UNDERLINE_UNSPECIFIED = 0;
  UNDERLINE_NONE = 1;
  UNDERLINE_SINGLE = 2;
  UNDERLINE_DOUBLE = 3;
  UNDERLINE_CURLY = 4;
  UNDERLINE_DOTTED = 5;
  UNDERLINE_DASHED = 6;
}

message Cursor {
  uint32 row = 1;
  uint32 column = 2;
  CursorShape shape = 3;
  bool blinking = 4;
}

enum CursorShape {
  CURSOR_SHAPE_UNSPECIFIED = 0;
  CURSOR_SHAPE_BLOCK = 1;
  CURSOR_SHAPE_BAR = 2;
  CURSOR_SHAPE_UNDERLINE = 3;
  CURSOR_SHAPE_BLOCK_HOLLOW = 4;
}
